{ id:"loops", course:"int100", title:"Repetition: while, do-while and for", clo:"CLO c", lab:"loops",
  sub:"Counter, sentinel and flag-controlled loops, do-while for input validation, for loops and choosing the right loop.",
  notes:`
<p>A loop repeats statements while a condition is true. Every loop needs an <b>initialisation</b>, a <b>condition</b> and an <b>update</b> that eventually makes the condition false.</p>
${codeBlock(`
int sum = 0, num = console.nextInt();
while (num != -1) {             // sentinel-controlled
    sum = sum + num;
    num = console.nextInt();    // update: read the next value
}

do {                            // runs at least once
    System.out.print("Enter a score (0-50): ");
    score = console.nextInt();
} while (score < 0 || score > 50);

for (int i = 1; i <= 5; i++)    // counter-controlled
    System.out.print(i * i + " ");    // 1 4 9 16 25`)}
<ul>
<li><b>for</b>: you know the number of repetitions in advance.</li>
<li><b>while</b>: you don't know how many times, and it may be zero.</li>
<li><b>do-while</b>: you don't know how many times, but it is at least once, which is ideal for input validation.</li>
<li>Forgetting the update gives an <b>infinite loop</b>.</li>
<li>Digit tricks: <code>n % 10</code> is the last digit and <code>n / 10</code> removes it.</li>
</ul>`,
  practice:[
   {k:"Predict the output", code:`int i = 1;
while (i < 10) {
    System.out.print(i + " ");
    i = i * 3;
}`, o:["1 3 9","1 3 9 27","1 2 3 ... 9","3 9"], a:0, why:"i takes the values 1, 3 and 9. Then i becomes 27, and the condition 27 < 10 is false."},
   {k:"Predict the output", code:`int n = 5;
do {
    System.out.print(n + " ");
    n++;
} while (n < 3);`, o:["Nothing","5","5 6","Infinite loop"], a:1, why:"A do-while runs its body once before testing. 6 < 3 is false, so it stops after printing 5."},
   {k:"Predict the output", code:`int sum = 0;
for (int i = 2; i <= 10; i += 2)
    sum += i;
System.out.println(sum);`, o:["30","20","55","28"], a:0, why:"i is 2, 4, 6, 8 and 10. Their sum is 30."},
   {k:"Concept", code:"", q:"A program must keep asking for a PIN until the user types a valid one. Which loop fits best?", o:["for","while","do-while","No loop is needed"], a:2, why:"The user must be asked at least once, and the number of attempts is unknown. That is the do-while case."}
  ]},
{ id:"nested", course:"int100", title:"break, continue and nested loops", clo:"CLO c", lab:"nested",
  sub:"Leaving a loop early, skipping an iteration, and loops inside loops for patterns and tables.",
  notes:`
<p><code>break</code> ends the whole loop immediately. <code>continue</code> skips the rest of the current iteration and goes on to the next one.</p>
${codeBlock(`
int num = 12, sum = 0;
while (num >= 0) {
    if (num % 5 == 0)
        break;                  // stops at 10
    System.out.print(num + " ");
    sum = sum + num;
    num = num - 1;
}
// prints 12 11, and sum is 23

for (int i = 1; i <= 4; i++) {          // outer loop: rows
    for (int j = 1; j <= i; j++)        // inner loop: columns
        System.out.print("* ");
    System.out.println();
}
// *
// * *
// * * *
// * * * *`)}
<ul>
<li>In a <code>for</code> loop, <code>continue</code> still runs the update (<code>i++</code>). In a while loop, put the update before <code>continue</code>, or the loop never ends.</li>
<li>For each pass of the outer loop, the inner loop runs completely.</li>
<li>A pattern of n rows usually means the outer loop counts rows and the inner loop's limit depends on the row number.</li>
<li><code>break</code> inside a nested loop leaves only the innermost loop.</li>
</ul>`,
  practice:[
   {k:"Predict the output", code:`for (int i = 1; i <= 6; i++) {
    if (i % 3 == 0)
        continue;
    System.out.print(i + " ");
}`, o:["1 2 4 5","1 2","3 6","1 2 3 4 5 6"], a:0, why:"When i is 3 or 6, continue skips the print. The other values are printed."},
   {k:"Predict the output", code:`for (int i = 1; i <= 3; i++) {
    for (int j = 1; j <= i; j++)
        System.out.print(i);
    System.out.println();
}`, o:["1, 22, 333 on three lines","1, 12, 123 on three lines","123 three times","111, 222, 333"], a:0, why:"Row i prints the number i, i times: 1, then 22, then 333."},
   {k:"Predict the output", code:`int count = 0;
for (int i = 0; i < 3; i++)
    for (int j = 0; j < 4; j++)
        count++;
System.out.println(count);`, o:["7","12","3","4"], a:1, why:"The inner loop runs 4 times for each of the 3 outer passes: 3 × 4 = 12."},
   {k:"Predict the output", code:`int k = 0;
while (true) {
    k += 3;
    if (k > 10) break;
}
System.out.println(k);`, o:["10","12","9","Infinite loop"], a:1, why:"k goes 3, 6, 9, 12. When k is 12, k > 10 is true and break ends the loop."}
  ]},
{ id:"files", course:"int100", title:"File input and output", clo:"CLO d", lab:"files",
  sub:"Reading with Scanner and FileReader, writing with PrintWriter, hasNext loops, closing files and FileNotFoundException.",
  notes:`
<p>File I/O has four steps: import the classes, create the file objects, read or write with the usual methods, and close the files.</p>
${codeBlock(`
import java.io.*;
import java.util.*;

public class SumFile {
    public static void main(String[] args) throws FileNotFoundException {
        Scanner inFile = new Scanner(new FileReader("inputData.txt"));
        PrintWriter outFile = new PrintWriter("result.txt");

        int sum = 0, count = 0;
        while (inFile.hasNext()) {          // until the data runs out
            sum += inFile.nextInt();
            count++;
        }
        outFile.printf("Sum: %d%nAverage: %.2f%n", sum, (double) sum / count);

        inFile.close();
        outFile.close();                    // flushes the output
    }
}`)}
<ul>
<li>A Scanner on a file uses the same methods as the keyboard: <code>nextInt</code>, <code>nextDouble</code>, <code>next</code>, <code>nextLine</code>.</li>
<li>A PrintWriter uses the same methods as <code>System.out</code>: <code>print</code>, <code>println</code>, <code>printf</code>.</li>
<li>If the input file is missing, Java throws <code>FileNotFoundException</code>. Because it is checked, <code>main</code> must declare <code>throws FileNotFoundException</code>.</li>
<li>Always close the output file. Without <code>close()</code>, buffered output may never reach the file, which can stay empty.</li>
<li>To add to the end of a file instead of replacing it, use <code>new PrintWriter(new FileWriter("data.txt", true))</code>.</li>
</ul>`,
  practice:[
   {k:"Concept", code:"", q:"Which statement opens the file prog.dat for reading?", o:["Scanner in = new Scanner(\"prog.dat\");","Scanner in = new Scanner(new FileReader(\"prog.dat\"));","PrintWriter in = new PrintWriter(\"prog.dat\");","FileReader in = new Scanner(\"prog.dat\");"], a:1, why:"Passing a plain String to Scanner reads the text \"prog.dat\" itself. A FileReader connects the Scanner to the file."},
   {k:"Spot the error", code:`public static void main(String[] args) {
    Scanner inFile = new Scanner(new FileReader("data.txt"));
    System.out.println(inFile.nextInt());
}`, o:["Compiles and runs","Compile error: unreported exception FileNotFoundException","Prints 0","NullPointerException"], a:1, why:"new FileReader can throw the checked FileNotFoundException. Add throws FileNotFoundException to main's header."},
   {k:"Concept", code:"", q:"A program writes 10 lines with outFile.println(...) but never calls outFile.close(). What is the most likely result?", o:["The file has all 10 lines","The file may be empty or incomplete","A compile error","The lines appear on the screen instead"], a:1, why:"PrintWriter buffers output. close() flushes the buffer into the file. Without it, the data can be lost."},
   {k:"Concept", code:"", q:"Which loop reads every integer in a file whose length is unknown?", o:["for (int i = 0; i < 10; i++)","while (inFile.hasNext())","do { } while (inFile == null);","while (inFile.nextInt() != 0)"], a:1, why:"hasNext() is true while there is still data to read, so the loop stops at the end of the file whatever its length."}
  ]},
{ id:"umethods", course:"int100", title:"Predefined and user-defined methods", clo:"CLO e", lab:"umethods",
  sub:"Value-returning and void methods, parameters and arguments, flow of execution, overloading and top-down design.",
  notes:`
<p>Methods split a large program into small parts that can be written, tested and reused separately. A <b>value-returning</b> method computes and returns a result; a <b>void</b> method performs an action.</p>
${codeBlock(`
public class LargerNumber {
    public static void main(String[] args) {
        double maxNumber = larger(12.5, 8.0);    // call: actual parameters
        System.out.printf("Larger: %.2f%n", maxNumber);
        printLine(20);                           // a void call stands alone
    }

    // header: modifiers, return type, name, formal parameters
    public static double larger(double x, double y) {
        if (x >= y)
            return x;
        else
            return y;
    }

    public static void printLine(int width) {
        for (int i = 0; i < width; i++)
            System.out.print("-");
        System.out.println();
    }
}`)}
<ul>
<li>Execution always starts in <code>main</code>. A call transfers control to the method; <code>return</code> sends control (and a value) back.</li>
<li>Arguments must match the parameters in number, order and type. In a call you write only the values, not their types.</li>
<li>Parameters are copies (pass-by-value): changing a parameter does not change the caller's variable.</li>
<li><b>Overloading:</b> several methods with the same name but different parameter lists. A different return type alone is not enough.</li>
<li><b>Top-down design:</b> break the problem into steps, write one method per step, and let <code>main</code> call them in order.</li>
</ul>`,
  practice:[
   {k:"Predict the output", code:`public static int square(int n) { return n * n; }

System.out.println(square(3) + square(4));`, o:["25","34","7","916"], a:0, why:"Each call returns an int: 9 + 16 = 25. Two ints are added, not joined as text."},
   {k:"Predict the output", code:`public static void change(int x) { x = 100; }

int a = 5;
change(a);
System.out.println(a);`, o:["100","5","0","Compile error"], a:1, why:"x receives a copy of a. Changing the copy does not affect a."},
   {k:"Concept", code:"", q:"Which pair of headers is NOT a valid overload of methodABC?", o:["void methodABC(int x) and void methodABC(double x)","void methodABC(int x, double y) and int methodABC(int x, double y)","void methodABC() and void methodABC(int x)","void methodABC(int x, char c) and void methodABC(char c, int x)"], a:1, why:"The parameter lists are identical and only the return type differs, which the compiler rejects."},
   {k:"Spot the error", code:`public static int sign(int n) {
    if (n > 0)
        return 1;
    else if (n < 0)
        return -1;
}`, o:["Compiles and works","Compile error: missing return statement","Returns 0 for n = 0","Run-time error"], a:1, why:"When n is 0 neither branch returns. Add else return 0; or a final return."}
  ]},
{ id:"arrays1d", course:"int100", title:"One-dimensional arrays", clo:"CLO f", lab:"arrays1d",
  sub:"Declaring and creating arrays, indexes and length, initializer lists, processing with loops, and index out of bounds.",
  notes:`
<p>An <b>array</b> stores a fixed number of values of the same type, accessed by index. The first index is 0 and the last is <code>length - 1</code>.</p>
${codeBlock(`
double[] sales = new double[5];                 // 5 elements, all 0.0
int[] list = {10, 20, 30, 40, 50, 60};          // list.length is 6

for (int i = 0; i < sales.length; i++)          // read
    sales[i] = console.nextDouble();

double sum = 0;                                 // sum and average
for (int i = 0; i < sales.length; i++)
    sum = sum + sales[i];
double average = sum / sales.length;

double largest = sales[0];                      // largest element
for (int i = 1; i < sales.length; i++)
    if (sales[i] > largest)
        largest = sales[i];`)}
<ul>
<li>New arrays are filled with default values: 0 for numbers, false for boolean, null for Strings.</li>
<li><code>length</code> is a field, written without brackets: <code>list.length</code>.</li>
<li>An index outside <code>0 … length-1</code> throws <code>ArrayIndexOutOfBoundsException</code>.</li>
<li><code>listA == listB</code> only checks whether both names refer to the same array. To compare contents, compare element by element.</li>
<li><code>b = a</code> copies the reference, not the elements. Copy with a loop to get a real copy.</li>
</ul>`,
  practice:[
   {k:"Predict the output", code:`int[] list = {10, 20, 30, 40, 50, 60};
System.out.println(list.length + " " + list[2]);`, o:["6 30","6 20","5 30","60 30"], a:0, why:"The array has 6 elements, and index 2 is the third element, 30."},
   {k:"Predict the output", code:`int[] a = new int[4];
a[1] = 5;
a[3] = a[1] * 2;
System.out.println(a[0] + a[1] + a[2] + a[3]);`, o:["15","0 5 0 10","10","Compile error"], a:0, why:"Unset elements are 0, so the sum is 0 + 5 + 0 + 10 = 15."},
   {k:"Predict the output", code:`int[] a = {3, 8, 1};
for (int i = 0; i <= a.length; i++)
    System.out.print(a[i] + " ");`, o:["3 8 1","3 8 1 0","Prints 3 8 1, then ArrayIndexOutOfBoundsException","Compile error"], a:2, why:"With <=, the loop also tries a[3], which does not exist, after printing the three elements."},
   {k:"Concept", code:"", q:"When can you write int[] n = {1, 2, 3}; without new?", o:["Never","Only when the array is declared and initialised in the same statement","Only for arrays of Strings","Only inside main"], a:1, why:"An initializer list without new is allowed only in the declaration itself. Later you would write n = new int[]{1, 2, 3};"}
  ]},
{ id:"arrmethods", course:"int100", title:"Arrays and methods", clo:"CLO f", lab:"arrmethods",
  sub:"Passing arrays to methods, returning results, copying, comparing, and sequential search.",
  notes:`
<p>A method receives a copy of the array's <b>reference</b>, so it works on the caller's array. Changes the method makes to elements are visible to the caller.</p>
${codeBlock(`
public static int sequentialSearch(int[] data, int item) {
    for (int loc = 0; loc < data.length; loc++)
        if (data[loc] == item)
            return loc;          // found: stop and return the index
    return -1;                   // not found
}

public static boolean areEqualArrays(int[] a, int[] b) {
    if (a.length != b.length)
        return false;
    for (int i = 0; i < a.length; i++)
        if (a[i] != b[i])
            return false;
    return true;
}

int pos = sequentialSearch(scores, 27);   // pass the name only`)}
<ul>
<li>Pass an array by its name: <code>printArray(list)</code>, not <code>printArray(list[])</code>.</li>
<li>The parameter type includes the brackets: <code>int[] data</code>.</li>
<li>Return -1 for "not found", because -1 can never be a valid index.</li>
<li>Do not put <code>return -1</code> inside the loop's else, or the search stops after the first element.</li>
<li>Methods keep main short: read, print, sum, largest and search can each be one method.</li>
</ul>`,
  practice:[
   {k:"Predict the output", code:`public static void doubleAll(int[] a) {
    for (int i = 0; i < a.length; i++) a[i] *= 2;
}

int[] nums = {1, 2, 3};
doubleAll(nums);
System.out.println(nums[2]);`, o:["3","6","Compile error","0"], a:1, why:"The method receives a reference to the same array, so doubling its elements changes nums."},
   {k:"Predict the output", code:`int[] data = {4, 27, 9, 27};
// sequentialSearch from the notes
System.out.println(sequentialSearch(data, 27) + " " + sequentialSearch(data, 5));`, o:["1 -1","3 -1","1 0","2 -1"], a:0, why:"The search returns the first match, at index 1. 5 is not in the array, so it returns -1."},
   {k:"Spot the error", code:`public static int find(int[] a, int key) {
    for (int i = 0; i < a.length; i++) {
        if (a[i] == key) return i;
        else return -1;
    }
    return -1;
}`, o:["Works correctly","Only ever checks the first element","Compile error","Always returns 0"], a:1, why:"The else returns -1 straight after checking a[0], so later elements are never examined. Remove the else."},
   {k:"Concept", code:"", q:"How do you call printArray(int[] list) with an array named scores?", o:["printArray(scores[]);","printArray(int[] scores);","printArray(scores);","printArray(scores.length);"], a:2, why:"In a call you pass just the array's name. Its type appears only in the method header."}
  ]},
{ id:"arrays2d", course:"int100", title:"Two-dimensional arrays", clo:"CLO f", lab:"arrays2d",
  sub:"Rows and columns, length of rows and columns, initialisation, and processing the whole array, a row or a column.",
  notes:`
<p>A two-dimensional array is a table of rows and columns: <code>matrix[row][col]</code>. Each row is itself a one-dimensional array.</p>
${codeBlock(`
int[][] matrix = { {3, 8, 1},
                   {4, 2, 9} };          // 2 rows, 3 columns
matrix.length         // 2   (number of rows)
matrix[0].length      // 3   (columns in row 0)

for (int row = 0; row < matrix.length; row++) {          // print
    for (int col = 0; col < matrix[row].length; col++)
        System.out.printf("%4d", matrix[row][col]);
    System.out.println();
}

for (int row = 0; row < matrix.length; row++) {          // sum of each row
    int sum = 0;
    for (int col = 0; col < matrix[row].length; col++)
        sum = sum + matrix[row][col];
    System.out.println("Row " + (row + 1) + " sum = " + sum);
}`)}
<ul>
<li><code>new double[10][5]</code> creates 10 rows and 5 columns, all 0.0.</li>
<li><b>Row processing:</b> the outer loop goes over rows and the inner loop over columns. <b>Column processing</b> swaps them: the outer loop goes over columns.</li>
<li>Reset the sum (or largest) <i>inside</i> the outer loop, so each row or column starts fresh.</li>
<li>Rows can have different lengths (a ragged array), which is why the inner loop uses <code>matrix[row].length</code>.</li>
</ul>`,
  practice:[
   {k:"Predict the output", code:`int[][] m = { {1, 2, 3}, {4, 5, 6} };
System.out.println(m.length + " " + m[0].length + " " + m[1][2]);`, o:["2 3 6","3 2 6","2 3 5","6 3 6"], a:0, why:"There are 2 rows of 3 columns. m[1][2] is row 1, column 2, which holds 6."},

int sum = 0;
for (int r = 0; r < m.length; r++)
    sum += m[r][1];
System.out.println(sum);`, o:["12","9","21","6"], a:0, why:"The loop adds column 1 of every row: 2 + 4 + 6 = 12."},
   {k:"Concept", code:"", q:"For double[][] sales = new double[10][5], what are sales.length and sales[0].length?", o:["10 and 5","5 and 10","50 and 5","10 and 10"], a:0, why:"length on the 2D array gives the number of rows (10). length on one row gives its columns (5)."},
   {k:"Predict the output", code:`int[][] m = new int[2][3];
m[1][2] = 7;
System.out.println(m[0][0] + m[1][2]);`, o:["7","0","Compile error","ArrayIndexOutOfBoundsException"], a:0, why:"New int elements are 0, so 0 + 7 = 7."}
  ]}
];

  ["What does <code>break</code> do in a switch?","It leaves the switch. Without it, execution falls through into the next case."],
  ["Allowed selector types","<code>int</code>, <code>char</code>, <code>short</code>, <code>byte</code> (and String). Not double or boolean."],
  ["Which if does an else belong to?","The most recent if that does not yet have an else, whatever the indentation."],
  ["<code>equals</code> vs <code>compareTo</code>","<code>s1.equals(s2)</code> is true or false. <code>s1.compareTo(s2)</code> is negative, 0 or positive, depending on alphabetical order."],
  ["Conditional operator","<code>cond ? value1 : value2</code>. <code>max = (a &gt;= b) ? a : b;</code>"],
  ["Short-circuit evaluation","Java stops evaluating && as soon as one side is false, and || as soon as one side is true."],
  ["Series of ifs vs if … else if","In a series of separate ifs every condition is tested. In an else-if chain, testing stops at the first true condition."]

public class Calculator {
    public static void main(String[] args) {
        Scanner keyboard = new Scanner(System.in);

        int num2 = keyboard.nextInt();

            case '-': result = num1 - num2; break;
            case '*': result = num1 * num2; break;
            case '/': if (num2 != 0) result = (double) num1 / num2;
        }

            System.out.printf("%d %c %d = %d%n", num1, op, num2, (int) result);

    }
}`, out:"7 / 2 = 3.50", why:"Casting num1 to double before dividing keeps the fraction: 3.5, printed with two decimals."}

  ["Three parts of every loop","Initialise the loop variable, test the condition, and update the variable so the loop can end."],
  ["Counter-controlled loop","Repeats a known number of times: <code>for (int i = 1; i &lt;= n; i++)</code>."],
  ["Sentinel-controlled loop","Reads values until a special value such as -1 appears. Read once before the loop and again at the end of the body."],
  ["while vs do-while","while tests first and may run zero times. do-while runs the body first, so it always runs at least once."],

  ["Input validation with do-while","<code>do { read score; } while (score &lt; 0 || score &gt; 50);</code> repeats until the value is valid."],

  ["What causes an infinite loop?","A condition that never becomes false, usually because the update was forgotten or moves the wrong way."]

  ["continue in a loop","Skips the rest of this iteration and starts the next one."],
  ["continue in a for vs a while","In a for loop the update still runs. In a while loop it does not, so an update placed after continue is skipped."],

  ["<code>%3d</code> in pattern tables","Prints each number 3 characters wide, so the columns line up."],

  ["Scope of a local variable","From its declaration to the end of its block. A variable declared in main is not visible inside another method."],

{id:"shadow", unit:"classes", title:"The constructor that sets nothing", cls:"Shadow", kind:"output",
 code:`class Patient {

 fix:`class Patient {

 solution:`import java.util.Scanner;

class Calculator {
    private static Scanner console = new Scanner(System.in);
    private double operand1, operand2;
    private char operator;

    public Calculator() {
        operand1 = 0;
        operand2 = 0;
        operator = '+';
    }

    public void read() {
        System.out.print("Enter operand 1, operand 2 and the operator: ");
        operand1 = console.nextDouble();
        operand2 = console.nextDouble();
        operator = console.next().charAt(0);
    }

    public double getOperand1() { return operand1; }
    public double getOperand2() { return operand2; }
    public char getOperator() { return operator; }

    public double compute() {
        switch (operator) {
            case '+': return operand1 + operand2;
            case '-': return operand1 - operand2;
            case '*': return operand1 * operand2;
            case '/':
                if (operand2 == 0) {
                    System.out.println("Cannot divide by zero");

 solution:`public class Lab9 {
    public static double power(int x, int y) {
        if (y == 0) return 1;
        if (y == 1) return x;
        if (y < 0) return 1.0 / power(x, -y);
        return x * power(x, y - 1);
    }

    public static int multiply(int m, int n) {
        if (n == 0) return 0;
        return m + multiply(m, n - 1);
    }

    public static void main(String[] args) {
        System.out.println("4^3 = " + power(4, 3));
        System.out.println("5^-2 = " + power(5, -2));
        System.out.println("6 x 4 = " + multiply(6, 4));
    }
}`, cls:"Lab9", inputs:[""]},

 solution:`import java.util.*;

public class PalindromeString {
    public static void main(String[] args) {
        Scanner keyboard = new Scanner(System.in);
        System.out.print("Enter a word: ");
        String word = keyboard.next();
        System.out.println();
        if (isPalindrome(word))
            System.out.println(word + " is a palindrome");
        else
            System.out.println(word + " is not a palindrome");
    }

    public static boolean isPalindrome(String str) {
        str = str.toLowerCase();
        int i = 0, j = str.length() - 1;
        while (i < j) {
            if (str.charAt(i) != str.charAt(j))
                return false;
            i++;
            j--;
        }
        return true;
    }
}`, cls:"PalindromeString", inputs:["Madam","Java"]},

public class ArrayTools {

 solution:`import java.util.*;

public class ArrayTools {
    public static void main(String[] args) {
        Scanner console = new Scanner(System.in);
        int[] data = new int[8];
        System.out.print("Enter 8 integers: ");
        readArray(data, console);
        System.out.print("Value to find: ");
        int item = console.nextInt();
        System.out.println();
        printArray(data);

        int pos = sequentialSearch(data, item);
        if (pos == -1)
            System.out.println(item + " is not in the array");
        else
            System.out.println(item + " first appears at index " + pos + ", "
                    + countOccurrences(data, item) + " time(s) in total");
    }

    public static void readArray(int[] list, Scanner in) {
        for (int i = 0; i < list.length; i++)
            list[i] = in.nextInt();
    }

    public static void printArray(int[] list) {
        for (int i = 0; i < list.length; i++)
            System.out.print(list[i] + " ");
        System.out.println();
    }

    public static int sequentialSearch(int[] list, int item) {
        for (int loc = 0; loc < list.length; loc++)
            if (list[loc] == item)
                return loc;
        return -1;
    }

    public static int countOccurrences(int[] list, int item) {
        int count = 0;
        for (int i = 0; i < list.length; i++)
            if (list[i] == item)
                count++;
        return count;
    }
}`, cls:"ArrayTools", inputs:["7 3 9 3 12 5 3 8\n3","7 3 9 3 12 5 3 8\n4"]},

   ["average divides the sum by a.length without integer division",0.5,[/\(\s*double\s*\)|\/\s*\(double\)|1\.0\s*\*/]],

  model:`import java.util.*;

public class ArrayStats {
    public static double average(int[] a) {
        int sum = 0;
        for (int i = 0; i < a.length; i++)
            sum += a[i];
        return (double) sum / a.length;
    }

    public static int countAbove(int[] a, double limit) {
        int count = 0;
        for (int i = 0; i < a.length; i++)
            if (a[i] > limit)
                count++;
        return count;
    }

    public static void main(String[] args) {
        Scanner console = new Scanner(System.in);
        int[] values = new int[6];
        System.out.print("Enter 6 integers: ");
        for (int i = 0; i < values.length; i++)
            values[i] = console.nextInt();

        double avg = average(values);
        System.out.printf("Average: %.2f%n", avg);
        System.out.println("Above average: " + countAbove(values, avg));
    }
}`},

import java.util.*;

public class TempReport {
    public static void main(String[] args) throws FileNotFoundException {
        Scanner inFile = new Scanner(new FileReader("temps.txt"));
        PrintWriter outFile = new PrintWriter("report.txt");

        double first = inFile.nextDouble();
        double max = first, min = first;
        while (inFile.hasNext()) {
            double t = inFile.nextDouble();
            if (t > max) max = t;
            if (t < min) min = t;
        }

        outFile.printf("Highest: %.1f%n", max);
        outFile.printf("Lowest: %.1f%n", min);
        inFile.close();
        outFile.close();
    }
}`},

/* One-page cheat sheets. Each: sections of [heading, html]. */
const CHEATS = {
methods:[
 ["Method template", `<pre>public static <i>returnType</i> name(<i>type</i> p1, <i>type</i> p2) {
    // body
    return value;      // omit for void
}</pre>`],
 ["Rules",`<ul><li>Every path of a value-returning method must <code>return</code>.</li>
<li>Java is pass-by-value. Primitives are copied, so the caller's variable never changes.</li>
<li>For an array or object argument, the reference is copied and the object is shared.</li>
<li>Overloading means the same name with different parameter lists. The return type does not count.</li>
<li>A local variable must be given a value before it is used.</li></ul>`],
 ["Watch out",`<ul><li><code>5 / 9</code> is 0. Write <code>5.0 / 9</code>.</li>
<li><code>double avg = sum / count;</code> with ints gives a whole number. Write <code>(double) sum / count</code>.</li>
<li><code>if (x &gt; 0);</code> has an empty body because of the semicolon.</li>
<li>Compare Strings with <code>equals</code>, not <code>==</code>.</li></ul>`],
 ["Useful library calls",`<ul><li><code>Character.isUpperCase(c)</code>, <code>Character.toUpperCase(c)</code></li>
<li><code>str.charAt(i)</code>, <code>str.length()</code>, <code>str.equals(other)</code></li>
<li><code>Math.max(a, b)</code>, <code>Math.min</code>, <code>Math.pow</code>, <code>Math.sqrt</code></li>
<li><code>console.next().charAt(0)</code> reads a single char</li></ul>`],
 ["Exam checklist",`<ol><li>Header matches the question: name, parameters, return type.</li><li>Variables initialised (counters start at 0).</li><li>Loop bounds use <code>&lt;</code>.</li><li>main creates the data, calls the method and prints the result.</li></ol>`]
],
arrays:[
 ["Declare and create",`<pre>int[] a = new int[5];          // 0,0,0,0,0
double[] d = {2.5, 7.0, 1.5};  // initializer
Book[] books = new Book[3];    // 3 x null
books[0] = new Book();         // now one object</pre>`],
 ["Standard loops",`<pre>for (int i = 0; i &lt; a.length; i++) { ... a[i] ... }
for (int x : a) { ... x ... }   // read only, no index</pre>`],
 ["Patterns to know",`<ul><li><b>Sum or average:</b> sum += a[i], then <code>(double) sum / a.length</code></li>
<li><b>Max or min:</b> start with a[0], loop from 1</li>
<li><b>Count:</b> <code>if (condition) count++;</code></li>
<li><b>Search:</b> return the index (or object) when found, otherwise -1 (or null)</li>
<li><b>Shift left:</b> <code>a[i] = a[i + 1]</code> while <code>i &lt; a.length - 1</code></li></ul>`],
 ["Arrays of objects",`<ul><li>Each element needs its own <code>new</code>, or you get NullPointerException.</li>
<li>Read values through getters: <code>arr[i].getSalary()</code>.</li>
<li>Pass the array by name: <code>display(movies)</code>, not <code>display(movies[])</code>.</li></ul>`],
 ["Watch out",`<ul><li><code>a.length</code> has no brackets. <code>str.length()</code> has them.</li><li>The last index is <code>length - 1</code>.</li><li><code>b = a</code> copies the reference, not the elements.</li></ul>`]
],
classes:[
 ["Class template",`<pre>public class Employee {
    private String name;              // data members
    private double salary;
    private static int count = 0;     // shared by all objects

    public Employee() { name = ""; salary = 0.0; count++; }
    public Employee(String name, double salary) {
        setData(name, salary); count++;
    }
    public void setData(String name, double salary) {
        this.name = name;
        if (salary &gt; 0) this.salary = salary;   // validate
    }
    public double getSalary() { return salary; }
    public String toString() { return name + " " + salary; }
}</pre>`],
 ["Rules",`<ul><li>A constructor has the class name and no return type, not even void.</li>
<li>Writing any constructor removes the default one.</li>
<li><code>this.x = x;</code> when a parameter has the same name as a field.</li>
<li>Static methods (including main) cannot use instance fields directly.</li>
<li>Fields get default values. Local variables do not.</li></ul>`],
 ["Objects and references",`<ul><li><code>Employee b = a;</code> makes an alias, not a copy.</li>
<li>To copy: <code>new Employee(a.getName(), a.getSalary())</code>.</li>
<li><code>a == b</code> asks whether they are the same object. <code>equals</code> compares contents.</li>
<li>A method can take another object of the same class: <code>a.totalBalance(b)</code>.</li></ul>`],
 ["Exam checklist",`<ol><li>Fields private, with the exact names and types asked for.</li><li>Both constructors, and the parameterised one calls setData.</li><li>One get method per field.</li><li>print or toString shows every field.</li></ol>`]
],
inheritance:[
 ["Subclass template",`<pre>public class Surgeon extends Doctor {
    private String specialization;

    public Surgeon(String name, int salary, String spec) {
        super(name, salary);          // must be first
        specialization = spec;
    }
    @Override
    public void print() {
        super.print();                // reuse the parent
        System.out.println("Spec: " + specialization);
    }
}</pre>`],
 ["Rules",`<ul><li>A class extends exactly one class.</li>
<li>Constructors are not inherited. If you do not write <code>super(...)</code>, Java inserts <code>super()</code>.</li>
<li>Private superclass fields need getters. Use <code>protected</code> for subclass access.</li>
<li>Overriding keeps the same signature. Overloading changes the parameters.</li>
<li>Constructors run from the top down: superclass first.</li></ul>`],
 ["Polymorphism",`<ul><li><code>Doctor d = new Surgeon(...);</code> is allowed because a Surgeon is a Doctor.</li>
<li><b>Compile time:</b> the declared type decides which methods you may call.</li>
<li><b>Run time:</b> the object decides which version runs.</li>
<li>Subclass-only methods need a check and a cast: <code>if (d instanceof Surgeon) ((Surgeon) d).getSpec();</code></li></ul>`],
 ["Exam checklist",`<ol><li><code>extends</code> in the class header.</li><li><code>super(...)</code> is the first line of every constructor.</li><li>Overridden print or toString starts with <code>super.print()</code>.</li><li><code>@Override</code> on every override.</li></ol>`]
],
recursion:[
 ["Template",`<pre>static int solve(int n) {
    if (<i>base case</i>) {
        return <i>known answer</i>;
    }
    return <i>combine</i>(n, solve(<i>smaller n</i>));
}</pre>`],
 ["Classic methods",`<pre>factorial: if (n &lt;= 1) return 1;  return n * factorial(n - 1);
power:     if (e == 0) return 1;  return b * power(b, e - 1);
sum 1..n:  if (n == 0) return 0;  return n + sum(n - 1);
multiply:  if (n == 0) return 0;  return m + multiply(m, n - 1);
digits:    if (n &lt; 10) return 1;  return 1 + digits(n / 10);
array sum: if (n == 0) return 0;  return a[n-1] + sum(a, n - 1);
print i..: if (i == a.length) return; print a[i]; rec(a, i + 1);</pre>`],
 ["Checklist",`<ol><li>Is there a base case?</li><li>Does every call move closer to it?</li><li>Is the result of the recursive call used, by return or combine?</li><li>Is the return type wide enough? A negative power needs double.</li></ol>`],
 ["Tracing tip",`Write the calls going down until the base case, then fill in the returns going back up:<br><code>f(3) = 3·f(2) = 3·2·f(1) = 3·2·1 = 6</code>`],
 ["Watch out",`<ul><li>No base case, or no progress toward it, gives StackOverflowError.</li><li>Printing before or after the recursive call reverses the order.</li></ul>`]
],
composition:[
 ["Composition template",`<pre>public class Cinema {
    private ActionMovie featureMovie;      // has-a
    private double ticketPrice;

    public Cinema(ActionMovie m, double price) {
        setData(m, price);
    }
    public void setData(ActionMovie m, double price) {
        featureMovie = m;
        ticketPrice = price;
    }
    public void print() {
        featureMovie.print();               // delegate
        System.out.println("Price: " + ticketPrice);
    }
}</pre>`],
 ["is-a or has-a?",`<ul><li><b>is-a</b>: use <code>extends</code> (Surgeon is a Doctor).</li><li><b>has-a</b>: use a private field (Person has a Job).</li><li>UML: a filled diamond means composition, a hollow diamond means aggregation.</li></ul>`],
 ["Rules",`<ul><li>The contained object must be created with <code>new</code>, or received in the constructor.</li>
<li>Reach inside with getters: <code>p.getJob().getSalary()</code>.</li>
<li><code>"Job: " + job</code> calls <code>job.toString()</code> automatically.</li>
<li>Defensive copy: <code>when = new Date(d.getDay());</code> stops outside code changing your object.</li></ul>`],
 ["Exam checklist",`<ol><li>Field type is the other class.</li><li>Constructor or setData stores or creates the object.</li><li>print or toString delegates to the contained object.</li><li>The driver builds the inner object first, then the outer one.</li></ol>`]
],
exceptions:[
 ["Template",`<pre>try {
    int n = console.nextInt();
    System.out.println(data[n] / n);
} catch (InputMismatchException e) {      // specific first
    System.out.println("Whole numbers only");
    console.nextLine();                    // discard bad input
} catch (ArrayIndexOutOfBoundsException e) {
    System.out.println("Index out of range");
} catch (ArithmeticException e) {
    System.out.println(e.getMessage());    // "/ by zero"
} finally {
    System.out.println("always runs");
}</pre>`],
 ["Common exceptions",`<ul><li><b>InputMismatchException</b>: nextInt() reads text</li><li><b>ArrayIndexOutOfBoundsException</b>: index &lt; 0 or ≥ length</li><li><b>ArithmeticException</b>: integer divided by zero</li><li><b>NullPointerException</b>: method called on null</li><li><b>NumberFormatException</b>: Integer.parseInt("abc")</li></ul>`],
 ["Rules",`<ul><li>Specific catch blocks go before general ones, or you get a compile error.</li>
<li>Checked exceptions (extend Exception) must be caught or declared with <code>throws</code>.</li>
<li><code>throw new X("msg")</code> raises one. <code>throws X</code> in a header declares one.</li>
<li>Multi-catch: <code>catch (A | B e)</code>.</li>
<li>Custom: <code>class AgeException extends Exception { AgeException(String m) { super(m); } }</code></li></ul>`],
 ["Watch out",`<ul><li>Integer division by zero throws, but double division gives Infinity.</li><li>Clear a bad token after InputMismatchException, or a retry loop never ends.</li></ul>`]
]
};

/* A small Java-style printf for %d %f %s %c %n %% with flags - and 0, width and precision. */
function javaFormat(fmt, args){
  let out="", ai=0, i=0;
  while(i<fmt.length){
    const ch=fmt[i];
    if(ch!=="%"){ out+=ch; i++; continue; }
    const m=/^%(-)?(0)?(\d+)?(?:\.(\d+))?([dfscn%])/.exec(fmt.slice(i));
    if(!m) throw new Error("UnknownFormatConversionException: Conversion = '"+(fmt[i+1]||"%")+"'");
    const [all,minus,zero,width,prec,conv]=m; i+=all.length;
    if(conv==="n"){ out+="\n"; continue; }
    if(conv==="%"){ out+=J.pad("%",+width||0,!!minus); continue; }
    if(ai>=args.length) throw new Error("MissingFormatArgumentException: Format specifier '"+all+"'");
    const a=args[ai++]; let s;
    if(conv==="d"){ if(a.t!=="int") throw new Error("IllegalFormatConversionException: d != "+a.jt); s=String(a.v); }
    else if(conv==="f"){ if(a.t!=="double") throw new Error("IllegalFormatConversionException: f != "+a.jt); s=J.f(a.v,prec===undefined?6:+prec); }
    else if(conv==="c"){ if(a.t!=="char"&&a.t!=="int") throw new Error("IllegalFormatConversionException: c != "+a.jt); s=a.t==="int"?String.fromCharCode(a.v):a.v; }
    else { s=a.t==="double"?J.d(a.v):String(a.v); if(prec!==undefined) s=s.slice(0,+prec); }
    if(width){ const w=+width; if(zero&&!minus&&(conv==="d"||conv==="f")){ const neg=s[0]==="-"; let body=neg?s.slice(1):s; while(body.length+(neg?1:0)<w) body="0"+body; s=(neg?"-":"")+body; } else s=J.pad(s,w,!!minus); }
    out+=s;
  }
  return out;
}
function parseArgs(text){
  const res=[]; const re=/\s*("(?:[^"\\]|\\.)*"|'(?:[^'\\]|\\.)'|-?\d+\.\d*|-?\d+)\s*(?:,|$)/y; let m; re.lastIndex=0;
  const t=text.trim(); if(!t) return res;
  let pos=0;
  while(pos<t.length){ re.lastIndex=pos; m=re.exec(t); if(!m) throw new Error("Could not read the arguments. Separate them with commas, put Strings in \"double quotes\" and chars in 'single quotes'.");
    const v=m[1]; pos=re.lastIndex;
    if(v[0]==='"') res.push({t:"String",jt:"java.lang.String",v:v.slice(1,-1)});
    else if(v[0]==="'") res.push({t:"char",jt:"java.lang.Character",v:v.slice(1,-1)});
    else if(v.includes(".")) res.push({t:"double",jt:"java.lang.Double",v:parseFloat(v)});
    else res.push({t:"int",jt:"java.lang.Integer",v:parseInt(v,10)});
  }
  return res;
}
/* String explorer: evaluate one String method the Java way. */
function stringOp(s, op, a, b){
  const idx=(i,len,name)=>{ if(!Number.isInteger(i)||i<0||i>=len) throw new Error(`StringIndexOutOfBoundsException: index ${i}, length ${len}`); return i; };
  const num=x=>{ const n=parseInt(x,10); if(isNaN(n)) throw new Error("Type a whole number for the index."); return n; };
  switch(op){
    case "length": return {r:s.length,type:"int",hi:[...Array(s.length).keys()]};
    case "charAt": { const i=idx(num(a),s.length); return {r:"'"+s[i]+"'",type:"char",hi:[i]}; }
    case "indexOf": { const r=s.indexOf(a); return {r,type:"int",hi:r<0?[]:[...Array(a.length).keys()].map(k=>r+k)}; }
    case "lastIndexOf": { const r=s.lastIndexOf(a); return {r,type:"int",hi:r<0?[]:[...Array(a.length).keys()].map(k=>r+k)}; }
    case "substring1": { const i=num(a); if(i<0||i>s.length) throw new Error(`StringIndexOutOfBoundsException: begin ${i}, end ${s.length}, length ${s.length}`); return {r:JSON.stringify(s.slice(i)),type:"String",hi:[...Array(s.length-i).keys()].map(k=>i+k)}; }
    case "substring2": { const i=num(a), j=num(b); if(i<0||j>s.length||i>j) throw new Error(`StringIndexOutOfBoundsException: begin ${i}, end ${j}, length ${s.length}`); return {r:JSON.stringify(s.slice(i,j)),type:"String",hi:[...Array(j-i).keys()].map(k=>i+k)}; }
    case "toUpperCase": return {r:JSON.stringify(s.toUpperCase()),type:"String",hi:[]};
    case "toLowerCase": return {r:JSON.stringify(s.toLowerCase()),type:"String",hi:[]};
    case "replace": { if(a.length!==1||b.length!==1) throw new Error("Type one character in each box."); const hi=[...s].map((c,k)=>c===a?k:-1).filter(k=>k>=0); return {r:JSON.stringify(s.split(a).join(b)),type:"String",hi}; }
    case "equals": return {r:String(s===a),type:"boolean",hi:[]};
    case "equalsIgnoreCase": return {r:String(s.toLowerCase()===a.toLowerCase()),type:"boolean",hi:[]};
    case "compareTo": { const n=Math.min(s.length,a.length); for(let k=0;k<n;k++) if(s[k]!==a[k]) return {r:s.charCodeAt(k)-a.charCodeAt(k),type:"int",hi:[k],note:`First difference at index ${k}: '${s[k]}' (${s.charCodeAt(k)}) − '${a[k]}' (${a.charCodeAt(k)}).`}; return {r:s.length-a.length,type:"int",hi:[],note:"No differing character, so the result is the difference in length."}; }
  }
}

/* ---------- line tracer programs ---------- */
function mkTR(code){
  const S=[]; let out="";
  const L=k=>{ const i=code.findIndex(x=>x.includes(k)); if(i<0) throw new Error("line not found: "+k); return i; };
  return { S, L,
    step(k,c,v,x){ S.push(Object.assign({l:typeof k==="number"?k:L(k), c, v:Object.assign({},v||{}), o:out}, x||{})); },
    print(s){ out+=String(s); }, println(s){ out+=(s===undefined?"":String(s))+"\n"; },
    get out(){ return out; } };
}

function switchRun(code, g, withBreak){
  const T=mkTR(code); const v={grade:`'${g}'`};
  T.step("char grade","grade = '"+g+"'",v);
  T.step("switch (grade)","The selector is evaluated once. Java jumps to the matching case label.",v);
  const cases=["A","B","C"]; let start=cases.indexOf(g);
  if(start<0){ T.step("default:","No case matches, so execution goes to default.",v); T.println("The grade is invalid."); T.step('"The grade is invalid."',"Printed.",v); return T.S; }
  T.step(`case '${g}':`,`case '${g}' matches.`,v);
  for(let k=start;k<cases.length;k++){
    if(k>start) T.step(`case '${cases[k]}':`,`No break, so execution falls through into case '${cases[k]}' even though grade is not '${cases[k]}'.`,v);
    T.println(`The grade is ${cases[k]}.`); T.step(`"The grade is ${cases[k]}."`,"Printed.",v);
    if(withBreak){ const bl=T.L(`"The grade is ${cases[k]}."`)+1; T.step(bl,"break leaves the switch.",v); return T.S; }
  }
  T.step("default:","Still falling through: default runs as well.",v); T.println("The grade is invalid."); T.step('"The grade is invalid."',"Printed.",v);
  return T.S;
}

const normOut = s => String(s).replace(/\r/g,"").split("\n").map(l=>l.replace(/\s+$/,"")).join("\n").replace(/^\n+|\n+$/g,"");

function cellEq(given, want){
  const g=String(given).trim().toLowerCase().replace(/\s+/g," "), w=String(want).trim().toLowerCase().replace(/\s+/g," ");
  if(w==="-") return ["-","","—","none","n/a"].includes(g);
  if(g===w) return true;
  const gn=Number(g), wn=Number(w);
  return g!=="" && !isNaN(gn) && !isNaN(wn) && gn===wn;
}
function shuffle(a){ a=[...a]; for(let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; } return a; }
function resultPill(ok, text){ return `<span class="pill ${ok?"good":"bad"}">${text||(ok?"Correct":"Not yet")}</span>`; }

/* each maker returns {grade, reveal}; in practice mode it renders its own Check button */
function mkMCQ(el,q,ctx){
  let picked = null;
  el.innerHTML=`${q.q?`<p><b>${esc(q.q)}</b></p>`:`<p><b>${q.k==="Spot the error"?"What happens when this code is compiled and run?":"What does this code print?"}</b></p>`}
    ${q.code?codeBlock(q.code):""}<div class="opts">${q.o.map((o,j)=>`<button type="button" class="opt" data-o="${j}">${esc(o)}</button>`).join("")}</div><div class="fb"></div>`;
  const opts=[...el.querySelectorAll(".opt")];
  const api={ grade:()=>picked===q.a, reveal(){
    opts.forEach((b,j)=>{ b.disabled=true; b.classList.toggle("right",j===q.a); b.classList.toggle("wrong",j===picked&&j!==q.a); b.classList.remove("sel"); });
    el.querySelector(".fb").innerHTML=`<div class="why">${resultPill(api.grade(), picked===null?"Not answered":null)} ${q.why}</div>`; }};
  opts.forEach(b=>b.addEventListener("click",()=>{ picked=+b.dataset.o;
    if(ctx.exam){ opts.forEach(x=>x.classList.toggle("sel",x===b)); }
    else { api.reveal(); record(ctx.key, api.grade()); } }));
  return api;
}
function mkTrace(el,t,ctx){
  const id="tr"+Math.random().toString(36).slice(2,8);
  el.innerHTML=`<p><b>Trace the code and write the exact output.</b> <span class="muted">One printed line per line. Spaces at the end of a line are ignored.</span></p>
    ${codeBlock(t.code)}
    <label class="f" for="${id}">Your output<textarea id="${id}" class="answer" rows="${Math.min(8,t.out.split("\n").length+1)}" spellcheck="false" placeholder="Type what the console shows"></textarea></label>
    ${ctx.exam?"":`<div class="controls"><button type="button" class="btn primary" data-a="check">Check my output</button><button type="button" class="btn" data-a="show">Show the answer</button></div>`}
    <div class="fb"></div>`;
  const ta=el.querySelector("textarea");
  const api={ grade:()=>normOut(ta.value)===normOut(t.out), reveal(showAll){
    const want=normOut(t.out).split("\n"), got=normOut(ta.value).split("\n"); const n=Math.max(want.length,got.length);
    let rows=""; for(let i=0;i<n;i++){ const ok=(got[i]??"")===(want[i]??""); rows+=`<tr class="${ok?"okrow":"badrow"}"><td>${i+1}</td><td><code>${esc(got[i]??"")||"&nbsp;"}</code></td><td><code>${esc(want[i]??"")||"&nbsp;"}</code></td><td>${ok?"✓":"✗"}</td></tr>`; }
    el.querySelector(".fb").innerHTML=`<div class="why">${resultPill(api.grade())}
      ${api.grade()&&!showAll?"":`<div style="overflow-x:auto;margin:8px 0"><table class="cmp"><thead><tr><th>Line</th><th>Yours</th><th>Expected</th><th></th></tr></thead><tbody>${rows}</tbody></table></div>`}
      <p>${t.why}</p></div>`; }};
  el.addEventListener("click",e=>{ const a=e.target.closest("[data-a]")?.dataset.a; if(!a) return;
    if(a==="check"){ api.reveal(false); record(ctx.key,api.grade()); }
    if(a==="show"){ api.reveal(true); if(!api.grade()) record(ctx.key,false); } });
  return api;
}
function mkTable(el,t,ctx){
  el.innerHTML=`<p><b>${esc(t.t)}</b>${t.note?` <span class="muted">${esc(t.note)}</span>`:""}</p>${codeBlock(t.code)}
    <div style="overflow-x:auto"><table class="ttable"><thead><tr>${t.cols.map(c=>`<th>${esc(c)}</th>`).join("")}</tr></thead><tbody>
    ${t.rows.map((r,i)=>`<tr>${r.map((c,j)=>Array.isArray(c)?`<td class="given"><code>${esc(c[0])}</code></td>`:`<td><input type="text" id="tc-${ctx.key.replace(/\W/g,"")}-${i}-${j}" aria-label="${esc(t.cols[j])}, row ${i+1}" data-r="${i}" data-c="${j}" autocomplete="off" spellcheck="false"></td>`).join("")}</tr>`).join("")}
    </tbody></table></div>
    ${ctx.exam?"":`<div class="controls"><button type="button" class="btn primary" data-a="check">Check the table</button><button type="button" class="btn" data-a="show">Fill in the answers</button></div>`}
    <div class="fb"></div>`;
  const ins=[...el.querySelectorAll("input[data-r]")];
  const want=i=>t.rows[+i.dataset.r][+i.dataset.c];
  const api={ grade:()=>ins.every(i=>cellEq(i.value,want(i))), reveal(fill){
    ins.forEach(i=>{ const ok=cellEq(i.value,want(i)); if(fill&&!ok) i.value=want(i); i.classList.toggle("ok",ok||fill); i.classList.toggle("bad",!ok&&!fill); if(!ok&&!fill) i.title="Expected: "+want(i); });
    const right=ins.filter(i=>i.classList.contains("ok")).length;
    el.querySelector(".fb").innerHTML=`<div class="why">${resultPill(api.grade(), fill&&!api.grade()?"Answers shown":`${ins.filter(i=>cellEq(i.value,want(i))).length} of ${ins.length} cells correct`)} ${!fill&&!api.grade()?"<span class='muted'>Hover over a red cell to see the expected value.</span>":""}<p>${t.why}</p></div>`; }};
  el.addEventListener("click",e=>{ const a=e.target.closest("[data-a]")?.dataset.a; if(!a) return;
    if(a==="check"){ const ok=api.grade(); api.reveal(false); record(ctx.key,ok); }
    if(a==="show"){ const ok=api.grade(); api.reveal(true); if(!ok) record(ctx.key,false); } });
  return api;
}
function mkErrors(el,t,ctx){
  const lines=t.code.split("\n");
  const errIdx=t.errs.map(x=>x.line!==undefined?x.line:lines.findIndex(l=>l.includes(x.m)));
  const marked=new Set();
  el.innerHTML=`<p><b>This code contains ${t.n} errors.</b> <span class="muted">Click each line that contains one. Errors may be compile-time or run-time.</span></p>
    <div class="code pick">${lines.map((l,i)=>`<div class="ln" role="button" tabindex="0" data-i="${i}" aria-pressed="false"><span class="no">${i+1}</span><span>${hl(l)||" "}</span></div>`).join("")}</div>

    ${ctx.exam?"":`<div class="controls"><button type="button" class="btn primary" data-a="check">Check my choices</button></div>`}
    <div class="fb"></div>`;
  const rows=[...el.querySelectorAll(".pick .ln")]; let done=false;
  const toggle=r=>{ if(done) return; const i=+r.dataset.i; marked.has(i)?marked.delete(i):marked.add(i); r.classList.toggle("mark",marked.has(i)); r.setAttribute("aria-pressed",marked.has(i)); el.querySelector("[data-count]").textContent=`Marked ${marked.size} of ${t.n}`; };
  rows.forEach(r=>{ r.addEventListener("click",()=>toggle(r)); r.addEventListener("keydown",e=>{ if(e.key==="Enter"||e.key===" "){ e.preventDefault(); toggle(r);} }); });
  const api={ grade:()=>errIdx.every(i=>marked.has(i)) && [...marked].every(i=>errIdx.includes(i)), reveal(){
    done=true; const found=errIdx.filter(i=>marked.has(i)).length, extra=[...marked].filter(i=>!errIdx.includes(i)).length;
    rows.forEach((r,i)=>{ r.classList.remove("mark"); if(errIdx.includes(i)) r.classList.add(marked.has(i)?"hit":"miss"); else if(marked.has(i)) r.classList.add("false"); });

function compareOutput(L, run, pasted){
  const norm=t=>String(t).replace(/\r/g,"").split("\n").map(l=>l.replace(/\s+$/,"")).join("\n").replace(/^\n+|\n+$/g,"");
  // ignore anything after the "--- file ---" marker for the screen comparison of file programs
  const expected=norm(run.output), got=norm(pasted);
  if(!got) return {state:"empty"};
  if(expected===got) return {state:"exact"};
  const numRe=/-?\d+(?:\.\d+)?/g;
  const promptNums=[]; (L.solution.match(/"(?:[^"\\]|\\.)*"/g)||[]).forEach(s=>{ (s.match(numRe)||[]).forEach(n=>promptNums.push(parseFloat(n))); });
  (String(run.input).match(numRe)||[]).forEach(n=>promptNums.push(parseFloat(n)));
  const need=(expected.match(numRe)||[]).map(parseFloat);
  const pool=(got.match(numRe)||[]).map(parseFloat);
  const missing=[];
  for(const n of need){ const k=pool.findIndex(x=>Math.abs(x-n)<1e-9); if(k>=0) pool.splice(k,1); else { const p=promptNums.findIndex(x=>Math.abs(x-n)<1e-9); if(p>=0) promptNums.splice(p,1); else missing.push(n); } }
  // words that carry the result (e.g. "palindrome", "not") must also appear
  const wordsNeeded=[...new Set((expected.toLowerCase().match(/\b(not|palindrome|letter|digit|range|zero|incorrect|invalid|division|found|equal|no)\b/g)||[]))];
  const wordsMissing=wordsNeeded.filter(w=>!new RegExp("\\b"+w+"\\b","i").test(got));
  if(!missing.length&&!wordsMissing.length) return {state:"values"};
  return {state:"diff",missing,wordsMissing};
}

function outputVerdict(c,run){

    if(!st.fin) return "";

      <div class="filebox"><div class="fh">Output file on disk</div><pre class="fout">${esc(st.fout)||'<span class="muted">empty</span>'}</pre></div>`;
  }
  function arrBox(st){
    if(!st.arr) return "";
    return `<div class="card" style="padding:12px"><div class="cells">${st.arr.vals.map((x,k)=>`<div class="cell ${k===st.arr.i?"i":""} ${k===st.arr.hit?"best":""}">${x}<small>[${k}]</small></div>`).join("")}</div></div>`;
  }
  function render(){
    const P=programs[pi], st=steps[i]||{v:{},o:"",c:""}, code=codeOf();
    el.innerHTML=`
      <div class="controls" style="margin-bottom:12px">${programs.map((p,k)=>`<button type="button" class="chip ${k===pi?"on":""}" data-p="${k}">${esc(p.name)}</button>`).join("")}</div>
      <div class="controls" style="margin-bottom:14px;align-items:flex-end">
        ${P.inputs.map(x=>x.area?`<label class="f" for="ti-${x.id}">${esc(x.label)}<textarea id="ti-${x.id}" class="answer" rows="3" style="width:260px">${esc(inp[x.id])}</textarea></label>`
          :`<label class="f" for="ti-${x.id}">${esc(x.label)}<input type="text" id="ti-${x.id}" value="${esc(inp[x.id])}" style="width:${Math.max(90,Math.min(260,String(x.def).length*10+30))}px"></label>`).join("")}
        <button type="button" class="btn" data-a="load">Run with these values</button>
      </div>
      ${err?`<div class="verdict err"><span>${esc(err)}</span></div>`:""}
      <div class="lab-wrap">
        <div class="stack">${codeBlock(code, st.l)}
          <div class="controls">
            <button type="button" class="btn" data-a="back" ${i===0?"disabled":""}>◀ Back</button>
            <button type="button" class="btn primary" data-a="next" ${i>=steps.length-1?"disabled":""}>Next step ▶</button>
            <button type="button" class="btn" data-a="play">${timer?"Pause":"Play"}</button>
            <span class="counter">Step ${i+1} / ${steps.length}</span>
          </div>
        </div>
        <div class="stack">
          <div class="caption ${st.err?"errcap":""}">${esc(st.c)}</div>
          <div class="card" style="padding:12px"><h4 class="sm">Variables</h4><div class="vars">${Object.keys(st.v).length?Object.entries(st.v).map(([k,v])=>`<span>${esc(k)} = ${esc(v)}</span>`).join(""):'<span class="muted" style="border:0;background:none">none yet</span>'}</div></div>
          ${arrBox(st)}
          <div class="console">${esc(st.o)}</div>
          ${fileBox(st)}
        </div>
      </div>`;
  }
  el.addEventListener("click",e=>{ const b=e.target.closest("button"); if(!b) return;
    if(b.dataset.p!==undefined){ stop(); pi=+b.dataset.p; setDefaults(); build(); }
    const a=b.dataset.a;
    if(a==="load"){ stop(); programs[pi].inputs.forEach(x=>{ const f=el.querySelector("#ti-"+x.id); if(f) inp[x.id]=f.value; }); build(); }
    if(a==="next") i=Math.min(steps.length-1,i+1);
    if(a==="back") i=Math.max(0,i-1);
    if(a==="play"){ if(timer) stop(); else { if(i>=steps.length-1) i=0; timer=setInterval(()=>{ if(!el.isConnected){ stop(); return; } if(i<steps.length-1){ i++; render(); } else { stop(); render(); } },850); } }
    render(); });
  setDefaults(); build(); render();
}
const STR_OPS=[["length","length()",0],["charAt","charAt(index)",1],["indexOf","indexOf(text)",1],["lastIndexOf","lastIndexOf(text)",1],["substring1","substring(begin)",1],["substring2","substring(begin, end)",2],["toUpperCase","toUpperCase()",0],["toLowerCase","toLowerCase()",0],["replace","replace(old, new)",2],["equals","equals(other)",1],["equalsIgnoreCase","equalsIgnoreCase(other)",1],["compareTo","compareTo(other)",1]];
function stringLab(el){
  let s="Programming with Java", op="substring2", a="3", b="7";
  let fmt="%-10s|%5d|%8.2f%n", args='"Sara", 42, 3.14159';
  const jlit=x=>op==="charAt"||op.startsWith("substring")?x:(op==="replace"?`'${x}'`:`"${x}"`);
  function render(){
    const O=STR_OPS.find(x=>x[0]===op); let res, err="";
    try{ res=stringOp(s,op,a,b); }catch(e){ err=e.message; }
    const call=op.replace(/[12]$/,"")+"("+(O[2]===0?"":O[2]===1?jlit(a):jlit(a)+", "+jlit(b))+")";
    let fout="", ferr="";
    try{ fout=javaFormat(fmt.replace(/\\n/g,"%n"),parseArgs(args)); }catch(e){ ferr=e.message; }
    el.innerHTML=`<div class="stack">
      <div class="card stack"><h3>String explorer</h3>
        <div class="controls" style="align-items:flex-end">
          <label class="f" for="sl-s">The String s<input type="text" id="sl-s" value="${esc(s)}" style="width:260px"></label>
          <label class="f" for="sl-op">Method<select id="sl-op">${STR_OPS.map(x=>`<option value="${x[0]}" ${x[0]===op?"selected":""}>${x[1]}</option>`).join("")}</select></label>
          ${O[2]>=1?`<label class="f" for="sl-a">${op==="replace"?"old char":op==="charAt"||op.startsWith("substring")?"begin / index":"text"}<input type="text" id="sl-a" value="${esc(a)}" style="width:110px"></label>`:""}
          ${O[2]>=2?`<label class="f" for="sl-b">${op==="replace"?"new char":"end"}<input type="text" id="sl-b" value="${esc(b)}" style="width:90px"></label>`:""}
          <button type="button" class="btn primary" data-a="str">Evaluate</button>
        </div>
        <div class="strcells">${[...s].map((c,k)=>`<div class="scell ${res&&res.hi.includes(k)?"on":""}"><b>${c===" "?"␣":esc(c)}</b><small>${k}</small></div>`).join("")}</div>
        ${codeBlock([`String s = ${JSON.stringify(s)};`, `s.${call}   // ${err?err:"→ "+res.type+" "+res.r}`],-1)}
        ${err?`<div class="verdict err"><span>${esc(err)}</span><span class="muted">The highlighted boxes show the valid indexes: 0 to ${s.length-1}.</span></div>`
             :`<div class="verdict ok"><span class="stage">Result</span><span><code>${esc(String(res.r))}</code> (${res.type})</span>${res.note?`<span class="muted">${esc(res.note)}</span>`:""}</div>`}
      </div>
      <div class="card stack"><h3>printf builder</h3>
        <p class="muted" style="margin:0">Type a format string and its arguments. Put Strings in "double quotes", chars in 'single quotes', and use a decimal point for doubles. Spaces in the output are shown as ·</p>
        <div class="controls" style="align-items:flex-end">
          <label class="f" for="pf-f">Format string<input type="text" id="pf-f" value="${esc(fmt)}" style="width:280px;font-family:var(--mono)"></label>
          <label class="f" for="pf-a">Arguments<input type="text" id="pf-a" value="${esc(args)}" style="width:240px;font-family:var(--mono)"></label>
          <button type="button" class="btn primary" data-a="fmt">Format</button>
        </div>
        <div class="controls">${['%d','%5d','%-5d','%05d','%f','%.2f','%8.2f','%-8.1f','%s','%-10s','%c','%%','%n'].map(t=>`<button type="button" class="chip" data-ins="${t}">${t}</button>`).join("")}</div>
        ${codeBlock([`System.out.printf("${fmt}", ${args});`],-1)}
        ${ferr?`<div class="verdict err"><span>${esc(ferr)}</span></div>`:`<div class="console fmt">${fout.split("\n").map(l=>esc(l).replace(/ /g,'<span class="sp">·</span>')).join("\n")}</div>
          <div class="ruler">${Array.from({length:40},(_,k)=>`<span>${(k+1)%10}</span>`).join("")}</div>`}
      </div></div>`;
  }
  el.addEventListener("click",e=>{ const bt=e.target.closest("button"); if(!bt) return;
    if(bt.dataset.a==="str"){ s=el.querySelector("#sl-s").value; const fa=el.querySelector("#sl-a"), fb=el.querySelector("#sl-b"); if(fa) a=fa.value; if(fb) b=fb.value; }
    if(bt.dataset.a==="fmt"){ fmt=el.querySelector("#pf-f").value; args=el.querySelector("#pf-a").value; }
    if(bt.dataset.ins){ fmt=el.querySelector("#pf-f").value+bt.dataset.ins; args=el.querySelector("#pf-a").value; }
    render(); });
  el.addEventListener("change",e=>{ if(e.target.id==="sl-op"){ op=e.target.value; s=el.querySelector("#sl-s").value;
      const d={charAt:["4",""],indexOf:["with",""],lastIndexOf:["a",""],substring1:["12",""],substring2:["3","7"],replace:["a","*"],equals:["programming with java",""],equalsIgnoreCase:["programming with java",""],compareTo:["Programs",""]}[op]; if(d){ a=d[0]; b=d[1]; } render(); } });
  render();
}
function matrixLab(el){
  let algo="rows", text="3 8 1 6\n4 2 9 7\n5 5 5 0", m=[], steps=[], i=0, timer=null, err="";
  function build(){ err=""; const rows=text.trim().split(/\n|;/).map(r=>r.trim().split(/[\s,]+/).filter(Boolean).map(Number));
    if(!rows.length||rows.some(r=>!r.length||r.some(isNaN))){ err="Type whole numbers: one row per line, values separated by spaces."; m=[[0]]; }
    else if(rows.length>6||rows.some(r=>r.length>6)){ err="Keep the table to 6 rows and 6 columns."; m=rows.slice(0,6).map(r=>r.slice(0,6)); }
    else m=rows;
    if(algo==="cols"&&m.some(r=>r.length!==m[0].length)){ err="Column processing needs every row to have the same length."; }
    steps=ALGOS2D[algo].run(m); i=0; }
  const stop=()=>{ clearInterval(timer); timer=null; };
  function render(){
    const A=ALGOS2D[algo], st=steps[i]||{v:{},o:""};
    const cellCls=(r,c)=>[st.cell&&st.cell[0]===r&&st.cell[1]===c?"i":"", st.best&&st.best[0]===r&&st.best[1]===c?"best":"", (st.row===r&&algo!=="cols")||(st.col===c&&algo==="cols")?"band":""].join(" ");
    el.innerHTML=`
      <div class="controls" style="margin-bottom:12px">${Object.entries(ALGOS2D).map(([k,v])=>`<button type="button" class="chip ${k===algo?"on":""}" data-algo="${k}">${v.name}</button>`).join("")}</div>
      <div class="controls" style="margin-bottom:14px;align-items:flex-end">
        <label class="f" for="mx-in">matrix (one row per line)<textarea id="mx-in" class="answer" rows="4" style="width:220px">${esc(text)}</textarea></label>
        <button type="button" class="btn" data-a="load">Load the table</button>
      </div>
      ${err?`<div class="verdict err" style="margin-bottom:12px"><span>${esc(err)}</span></div>`:""}
      <div class="lab-wrap">
        <div class="stack">${codeBlock(A.code, st.l)}
          <div class="controls">
            <button type="button" class="btn" data-a="back" ${i===0?"disabled":""}>◀ Back</button>
            <button type="button" class="btn primary" data-a="next" ${i>=steps.length-1?"disabled":""}>Next step ▶</button>
            <button type="button" class="btn" data-a="play">${timer?"Pause":"Play"}</button>
            <span class="counter">Step ${i+1} / ${steps.length}</span>
          </div>
        </div>
        <div class="stack">
          <div class="card" style="padding:12px;overflow-x:auto"><table class="mgrid"><thead><tr><th></th>${m[0].map((_,c)=>`<th>col ${c}</th>`).join("")}</tr></thead>
            <tbody>${m.map((r,ri)=>`<tr><th>row ${ri}</th>${r.map((x,c)=>`<td class="${cellCls(ri,c)}">${x}</td>`).join("")}</tr>`).join("")}</tbody></table></div>
          <div class="caption">${esc(st.c||"")}</div>
          <div class="vars">${Object.entries(st.v).map(([k,v])=>`<span>${esc(k)} = ${esc(v)}</span>`).join("")}</div>
          <div class="console">${esc(st.o)}</div>
          <div class="legend"><span style="--c:var(--accent)">current element</span><span style="--c:var(--run)">row or column being processed</span><span style="--c:var(--good)">largest so far</span></div>
        </div>
      </div>`;
  }
  el.addEventListener("click",e=>{ const b=e.target.closest("button"); if(!b) return;
    if(b.dataset.algo){ stop(); algo=b.dataset.algo; build(); }
    if(b.dataset.a==="load"){ stop(); text=el.querySelector("#mx-in").value; build(); }
    if(b.dataset.a==="next") i=Math.min(steps.length-1,i+1);
    if(b.dataset.a==="back") i=Math.max(0,i-1);
    if(b.dataset.a==="play"){ if(timer) stop(); else { if(i>=steps.length-1) i=0; timer=setInterval(()=>{ if(!el.isConnected){ stop(); return; } if(i<steps.length-1){ i++; render(); } else { stop(); render(); } },700); } }
    render(); });
  build(); render();
}

function unit(u, tab){
  main.innerHTML=`
  <div class="head"><div><span class="clo">${u.clo}</span><h1 style="margin-top:6px">${u.title}</h1><p class="sub">${u.sub}</p></div></div>
  <div class="tabs" role="tablist">${["Notes","Lab","Practice","Cheat sheet"].map(t=>`<button type="button" role="tab" class="${t===tab?"on":""}" data-tab="${t}">${t}${t==="Practice"?` (${unitItems(u)+BANK[u.id].cards.length})`:""}</button>`).join("")}</div>
  <div id="pane"></div>`;
  const pane=document.getElementById("pane");
  if(tab==="Notes"){ const nm=MISTAKES.filter(m=>m.unit===u.id).length; const lw=LABWALK.filter(l=>l.unit===u.id);
    pane.innerHTML=`<div class="notes">${u.notes}</div><div class="controls" style="margin-top:18px"><button type="button" class="btn primary" data-tab="Lab">Open the lab ▶</button>${nm?`<button type="button" class="btn" data-goto="mistakes">${nm} common mistake${nm>1?"s":""} in this unit</button>`:""}${lw.length?`<button type="button" class="btn" data-golab="${lw[0].lab}">Walkthrough${lw.length>1?"s":""}: ${lw.map(l=>l.label||"Lab "+l.lab).join(", ")}</button>`:""}</div>`;
    pane.querySelector("[data-goto]")?.addEventListener("click",()=>{ mistakesFilter=u.id; location.hash="#"+toolHash("mistakes"); });
    pane.querySelector("[data-golab]")?.addEventListener("click",e=>{ labSel=+e.target.dataset.golab; location.hash="#"+toolHash("labs"); }); }
  if(tab==="Cheat sheet"){ cheatSheet(pane,u); }
  if(tab==="Lab"){ pane.innerHTML=`<p class="muted" style="margin-bottom:14px">${LAB_INTRO[u.lab]}</p><div id="lab"></div>`; LABS[u.lab](document.getElementById("lab")); progress.lab[u.id]=1; store.set(progress); refreshNav(); }
  if(tab==="Practice"){ practice(pane,u); }
  main.querySelectorAll("[data-tab]").forEach(b=>b.addEventListener("click",()=>{ unit(u,b.dataset.tab); window.scrollTo(0,0); }));
}

  const u=ALL_UNITS.find(x=>x.id===h);
