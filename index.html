<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Java Tutor</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700&family=IBM+Plex+Sans:wght@400;500;600&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
<style>
/* Layout: fixed unit rail on the left, working area on the right; every unit = Notes / Lab / Practice tabs. */
:root{
  --bg:#f3f5f8; --surface:#ffffff; --ink:#152030; --muted:#5a6575; --line:#dce2ea;
  --accent:#2457d6; --accent-soft:#e3eafc; --run:#d98a00; --run-soft:#fdf1d8;
  --good:#1d8150; --good-soft:#e1f3e9; --bad:#c03636; --bad-soft:#fbe5e5;
  --code-bg:#101826; --code-ink:#dbe3ef; --code-line:#1c2738; --code-on:#24395e;
  --display:"Bricolage Grotesque", "Segoe UI", system-ui, sans-serif;
  --body:"IBM Plex Sans", "Segoe UI", system-ui, sans-serif;
  --mono:"JetBrains Mono", ui-monospace, Consolas, monospace;
  --base:15px;
  color-scheme: light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0c1117; --surface:#141b24; --ink:#e5eaf1; --muted:#97a2b2; --line:#253041;
    --accent:#7398ff; --accent-soft:#1c2a4a; --run:#f2b544; --run-soft:#3a2d12;
    --good:#4cc488; --good-soft:#123222; --bad:#ff7a7a; --bad-soft:#3a1717;
    --code-bg:#0a0f16; --code-line:#161f2c; --code-on:#22385e;
    color-scheme: dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0c1117; --surface:#141b24; --ink:#e5eaf1; --muted:#97a2b2; --line:#253041;
  --accent:#7398ff; --accent-soft:#1c2a4a; --run:#f2b544; --run-soft:#3a2d12;
  --good:#4cc488; --good-soft:#123222; --bad:#ff7a7a; --bad-soft:#3a1717;
  --code-bg:#0a0f16; --code-line:#161f2c; --code-on:#22385e;
  color-scheme: dark;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:var(--base);line-height:1.55}
body.projector{--base:19px}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
h1,h2,h3{font-family:var(--display);line-height:1.15;text-wrap:balance;margin:0}
h1{font-size:1.9em} h2{font-size:1.45em} h3{font-size:1.1em}
p{margin:0}
code{font-family:var(--mono);font-size:.9em;background:var(--accent-soft);padding:1px 5px;border-radius:4px}
.app{display:grid;grid-template-columns:260px 1fr;min-height:100%}
.rail{background:var(--surface);border-right:1px solid var(--line);padding:20px 14px;display:flex;flex-direction:column;gap:18px;position:sticky;top:0;height:100vh;overflow:auto}
.brand{display:flex;flex-direction:column;gap:2px;padding:0 8px}
.brand b{font-family:var(--display);font-size:1.35em}
.brand span{color:var(--muted);font-size:.85em}
.nav{display:flex;flex-direction:column;gap:2px}
.nav a{display:grid;grid-template-columns:1fr auto;align-items:center;gap:8px;padding:8px 8px;border-radius:8px;color:var(--ink);text-decoration:none;font-size:.95em}
.nav a:hover{background:var(--accent-soft)}
.nav a.on{background:var(--accent);color:#fff}
.nav a.on .wk{color:#dfe7ff}
.wk{font-family:var(--mono);font-size:.72em;color:var(--muted)}
.dot{width:10px;height:10px;border-radius:50%;border:2px solid var(--line)}
.dot.part{background:var(--run);border-color:var(--run)}
.dot.done{background:var(--good);border-color:var(--good)}
.rail-foot{margin-top:auto;display:flex;flex-direction:column;gap:10px;padding:0 8px;font-size:.85em;color:var(--muted)}
.meter{height:8px;background:var(--line);border-radius:4px;overflow:hidden}
.meter i{display:block;height:100%;background:var(--good);width:0}
.toggle{display:flex;align-items:center;gap:8px}
main{padding:28px clamp(16px,3vw,40px) 60px;min-width:0}
.head{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:12px;margin-bottom:18px}
.head .sub{color:var(--muted);margin-top:6px;max-width:70ch}
.clo{display:inline-block;font-family:var(--mono);font-size:.75em;padding:3px 8px;border-radius:20px;background:var(--accent-soft);color:var(--accent);font-weight:600}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);margin-bottom:20px;flex-wrap:wrap}
.tabs button{border:0;background:none;padding:10px 16px;border-bottom:3px solid transparent;font-weight:600;color:var(--muted)}
.tabs button.on{color:var(--ink);border-color:var(--accent)}
.card{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:18px}
.stack{display:flex;flex-direction:column;gap:16px}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(320px,1fr));gap:16px}
.notes{max-width:78ch;display:flex;flex-direction:column;gap:14px}
.notes ul{margin:0;padding-left:20px;display:flex;flex-direction:column;gap:4px}
.callout{border-left:4px solid var(--run);background:var(--run-soft);padding:10px 14px;border-radius:0 8px 8px 0}
.code{background:var(--code-bg);color:var(--code-ink);border-radius:10px;font-family:var(--mono);font-size:.84em;padding:10px 0;overflow-x:auto;line-height:1.6}
.code .ln{display:grid;grid-template-columns:38px 1fr;padding:0 14px 0 0;white-space:pre;border-left:3px solid transparent}
.code .ln .no{color:#56637a;text-align:right;padding-right:12px;user-select:none}
.code .ln.on{background:var(--code-on);border-left-color:var(--run)}
.code .ln.dim{opacity:.45}
.t-k{color:#ff8fb1}.t-s{color:#a5e38a}.t-n{color:#ffc66d}.t-c{color:#6f7d95;font-style:italic}.t-t{color:#7fc8ff}
.controls{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.btn{border:1px solid var(--line);background:var(--surface);padding:7px 14px;border-radius:8px;font-weight:600}
.btn:hover{border-color:var(--accent)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
.btn:disabled{opacity:.4;cursor:default}
.chip{border:1px solid var(--line);background:var(--surface);padding:5px 12px;border-radius:20px;font-family:var(--mono);font-size:.85em}
.chip.on{background:var(--accent);color:#fff;border-color:var(--accent)}
.counter{font-family:var(--mono);font-size:.85em;color:var(--muted);font-variant-numeric:tabular-nums}
.caption{background:var(--accent-soft);border-radius:8px;padding:10px 14px;min-height:48px}
.mem{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.mem h4{margin:0 0 8px;font-size:.75em;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.frame,.obj{border:1px solid var(--line);border-radius:8px;padding:8px 10px;margin-bottom:8px;background:var(--surface);font-family:var(--mono);font-size:.82em}
.frame b,.obj b{display:block;font-family:var(--body);font-size:.95em;margin-bottom:4px}
.frame.top{border-color:var(--accent);box-shadow:inset 3px 0 0 var(--accent)}
.obj.garbage{opacity:.45;border-style:dashed}
.kv{display:flex;justify-content:space-between;gap:10px;padding:1px 4px;border-radius:4px}
.kv.ch{background:var(--run-soft);outline:1px solid var(--run)}
.ref{color:var(--accent);font-weight:600}
.console{background:var(--code-bg);color:#a5e38a;font-family:var(--mono);font-size:.85em;padding:10px 14px;border-radius:8px;min-height:44px;white-space:pre-wrap}
.console::before{content:"Console";display:block;color:#56637a;font-size:.8em;margin-bottom:2px}
.lab-wrap{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,1fr);gap:16px;align-items:start}
.cells{display:flex;gap:6px;flex-wrap:wrap;margin:6px 0}
.cell{width:54px;text-align:center;border:2px solid var(--line);border-radius:8px;padding:6px 0;font-family:var(--mono);font-weight:600;font-variant-numeric:tabular-nums;background:var(--surface);transition:transform .2s}
.cell small{display:block;font-size:.7em;color:var(--muted);font-weight:400}
.cell.i{border-color:var(--accent);background:var(--accent-soft)}
.cell.j{border-color:var(--run);background:var(--run-soft)}
.cell.best{border-color:var(--good);background:var(--good-soft)}
.cell.sorted{opacity:.6}
.vars{font-family:var(--mono);font-size:.85em;display:flex;gap:14px;flex-wrap:wrap}
.vars span{background:var(--bg);border:1px solid var(--line);border-radius:6px;padding:2px 8px}
input[type=text],input[type=number],select{font:inherit;padding:6px 10px;border:1px solid var(--line);border-radius:8px;background:var(--surface);color:var(--ink)}
label.f{display:flex;flex-direction:column;gap:4px;font-size:.85em;color:var(--muted)}
.rstack{display:flex;flex-direction:column-reverse;gap:6px;min-height:120px}
.rframe{border:1px solid var(--line);border-radius:8px;padding:6px 10px;font-family:var(--mono);font-size:.82em;display:flex;justify-content:space-between;gap:8px;background:var(--surface)}
.rframe.top{border-color:var(--accent);box-shadow:inset 3px 0 0 var(--accent)}
.rframe.ret{border-color:var(--good);background:var(--good-soft)}
.rframe.err{border-color:var(--bad);background:var(--bad-soft)}
.stats{display:flex;gap:12px;flex-wrap:wrap}
.stat{background:var(--bg);border-radius:8px;padding:6px 12px;font-size:.85em}
.stat b{font-family:var(--mono);font-variant-numeric:tabular-nums;font-size:1.1em;margin-right:4px}
.tree{display:flex;flex-direction:column;align-items:center;gap:14px}
.tree .row{display:flex;gap:14px;justify-content:center;flex-wrap:wrap}
.cls{border:2px solid var(--line);border-radius:10px;padding:8px 12px;min-width:150px;background:var(--surface);font-size:.85em;position:relative}
.cls b{font-family:var(--display);font-size:1.05em;display:block}
.cls i{color:var(--muted);font-style:italic;font-size:.85em}
.cls ul{list-style:none;margin:4px 0 0;padding:0;font-family:var(--mono);font-size:.85em}
.cls li.m{color:var(--accent);font-weight:600}
.cls.decl{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.cls.actual{background:var(--run-soft);border-color:var(--run)}
.cls .tag{position:absolute;top:-10px;right:8px;font-size:.7em;font-weight:600;padding:1px 8px;border-radius:10px;color:#fff}
.tag.d{background:var(--accent)} .tag.a{background:var(--run);color:#1b1300}
.arrow{color:var(--muted);font-size:.8em;text-align:center}
.verdict{border-radius:10px;padding:12px 14px;display:flex;flex-direction:column;gap:6px}
.verdict.ok{background:var(--good-soft);border:1px solid var(--good)}
.verdict.err{background:var(--bad-soft);border:1px solid var(--bad)}
.verdict .stage{font-size:.75em;text-transform:uppercase;letter-spacing:.06em;font-weight:600;color:var(--muted)}
.q{display:flex;flex-direction:column;gap:10px}
.q .meta{display:flex;gap:8px;align-items:center;font-size:.8em;color:var(--muted)}
.pill{font-size:.75em;font-weight:600;padding:2px 9px;border-radius:12px;background:var(--bg);border:1px solid var(--line)}
.pill.good{background:var(--good-soft);border-color:var(--good);color:var(--good)}
.pill.bad{background:var(--bad-soft);border-color:var(--bad);color:var(--bad)}
.opts{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:8px}
.opt{text-align:left;border:1px solid var(--line);background:var(--surface);padding:9px 12px;border-radius:8px;font-family:var(--mono);font-size:.88em}
.opt:hover:not(:disabled){border-color:var(--accent)}
.opt.right{background:var(--good-soft);border-color:var(--good)}
.opt.wrong{background:var(--bad-soft);border-color:var(--bad)}
.opt:disabled{cursor:default}
.why{font-size:.92em;border-top:1px dashed var(--line);padding-top:8px}
.units{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:14px}
.ucard{display:flex;flex-direction:column;gap:8px;text-decoration:none;color:inherit}
.ucard:hover{border-color:var(--accent)}
.ucard .row{display:flex;justify-content:space-between;align-items:center}
.sorter{display:flex;flex-direction:column;gap:8px}
.pair{display:grid;grid-template-columns:1fr auto;gap:10px;align-items:center;border:1px solid var(--line);border-radius:8px;padding:8px 12px}
.pair.right{border-color:var(--good);background:var(--good-soft)}
.pair.wrong{border-color:var(--bad);background:var(--bad-soft)}
.pair .fb{grid-column:1/-1;font-size:.85em}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:.8em;color:var(--muted)}
.legend span::before{content:"";display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:5px;vertical-align:-1px;background:var(--c)}
.muted{color:var(--muted)}

.answer{font-family:var(--mono);font-size:.88em;width:100%;padding:10px 12px;border:1px solid var(--line);border-radius:8px;background:var(--surface);color:var(--ink);line-height:1.5;resize:vertical}
.code-in{tab-size:4;white-space:pre;overflow-x:auto}
.cmp,.ttable{border-collapse:collapse;font-size:.88em}
.cmp th,.cmp td,.ttable th,.ttable td{border:1px solid var(--line);padding:5px 10px;text-align:left}
.cmp th,.ttable th{background:var(--bg);font-weight:600}
.okrow td:last-child{color:var(--good);font-weight:600}.badrow td:last-child{color:var(--bad);font-weight:600}.badrow{background:var(--bad-soft)}
.ttable td.given{background:var(--bg)}
.ttable input{width:100%;min-width:70px;font-family:var(--mono);font-size:.95em;padding:4px 6px;border:1px solid var(--line);border-radius:6px;background:var(--surface);color:var(--ink)}
input.ok{border-color:var(--good)!important;background:var(--good-soft)!important}
input.bad{border-color:var(--bad)!important;background:var(--bad-soft)!important}
input.blank{background:#1c2a40;color:#fff;border:1px dashed #7fc8ff;border-radius:4px;font-family:var(--mono);font-size:1em;padding:0 4px;margin:0 2px}
input.blank.ok{color:var(--good)}input.blank.bad{color:var(--bad)}
.pick .ln{cursor:pointer}.pick .ln:hover{background:var(--code-line)}
.pick .ln.mark{background:#3a2d12;border-left-color:var(--run)}
.pick .ln.hit{background:#123222;border-left-color:#4cc488}
.pick .ln.miss{background:#3a2d12;border-left-color:#f2b544}
.pick .ln.false{background:#3a1717;border-left-color:#ff7a7a}
.errlist{margin:8px 0;padding-left:20px;display:flex;flex-direction:column;gap:8px}
.parsons{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px}
.parsons li{display:grid;grid-template-columns:auto 1fr auto;gap:10px;align-items:center;background:var(--code-bg);color:var(--code-ink);border:1px solid var(--line);border-left:4px solid transparent;border-radius:8px;padding:6px 10px;cursor:grab}
.parsons li code{background:none;padding:0;white-space:pre}
.parsons li.dragging{opacity:.5}
.parsons li.okline{border-left-color:var(--good)}.parsons li.badline{border-left-color:var(--bad)}
.grip{color:#56637a;letter-spacing:-2px}
.mv{display:flex;gap:4px}.mv button{border:1px solid #2a3850;background:#18233a;color:#cfd8e6;border-radius:5px;padding:1px 7px}.mv button:disabled{opacity:.3}
.prompt{max-width:80ch}.prompt ul{margin:6px 0;padding-left:20px}
.rubric{list-style:none;margin:8px 0;padding:0;display:flex;flex-direction:column;gap:4px}
.rubric li{display:flex;justify-content:space-between;gap:12px;padding:5px 10px;border-radius:6px}
.okli{background:var(--good-soft)}.badli{background:var(--bad-soft)}
.scoreline b{font-family:var(--display);font-size:1.4em;margin-right:6px}
.flash{display:flex;flex-direction:column;gap:12px;align-items:flex-start;text-align:left;min-height:220px;width:100%;max-width:720px;border:2px solid var(--line);border-radius:16px;background:var(--surface);padding:26px 28px;box-shadow:0 6px 0 var(--line);transition:transform .15s}
.flash:hover{transform:translateY(-2px)}
.flash.back{border-color:var(--accent);background:var(--accent-soft)}
.flash .side-label{font-size:.72em;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);font-weight:600}
.flash .flash-body{font-size:1.25em;line-height:1.5}
.flash.back .flash-body{font-size:1.05em}
.flash .hint{font-size:.85em;margin-top:auto}
.ptypes .chip{font-family:var(--body);font-weight:600}
.cnt{font-family:var(--mono);font-size:.8em;opacity:.75;margin-left:4px}
.opt.sel{border-color:var(--accent);background:var(--accent-soft)}
.fs{border:1px solid var(--line);border-radius:10px;padding:10px 14px;margin:0}
.fs legend{font-weight:600;padding:0 6px}
.exambar{position:sticky;top:0;z-index:5;display:flex;gap:16px;align-items:center;justify-content:space-between;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:10px 14px;margin-bottom:16px}
.counter.warn{color:var(--bad);font-weight:600}
.bignum{font-family:var(--display);font-size:2.2em;font-weight:700}
.barrow{display:grid;grid-template-columns:minmax(90px,150px) 1fr 44px;gap:10px;align-items:center;font-size:.88em;margin:4px 0}
.bar{height:10px;background:var(--line);border-radius:5px;overflow:hidden}.bar i{display:block;height:100%;background:var(--accent)}
h4.sm{margin:0 0 8px;font-size:.75em;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.mark{align-self:flex-end}
.formats{margin-bottom:20px}
.fgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:10px;margin-top:10px}
.fgrid div{display:flex;flex-direction:column;gap:2px;border-left:3px solid var(--accent);padding:4px 10px}
.fgrid span{font-size:.85em;color:var(--muted)}

.navlabel{font-size:.7em;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);padding:14px 8px 4px;font-weight:600}
.console.err{color:#ff9b9b}
.console.in{color:#9fd0ff}
.console.in::before{content:"Keyboard"}
.kind-compile,.kind-runtime{background:var(--bad-soft);border-color:var(--bad);color:var(--bad)}
.kind-output,.kind-loop{background:var(--run-soft);border-color:var(--run)}
.labgrid{display:grid;grid-template-columns:250px minmax(0,1fr);gap:18px;align-items:start}
.lablist{display:flex;flex-direction:column;gap:4px;position:sticky;top:12px}
.lablist button{display:grid;grid-template-columns:48px 1fr auto;gap:6px;align-items:center;text-align:left;border:1px solid transparent;background:none;padding:7px 8px;border-radius:8px;font-size:.9em}
.lablist button:hover{background:var(--accent-soft)}
.lablist button.on{background:var(--surface);border-color:var(--accent)}
.ladder{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px}
.ladder li{border:1px dashed var(--line);border-radius:10px;padding:10px 14px;background:transparent}
.ladder li.open{border-style:solid;background:var(--surface)}
.ladder .lh{display:flex;gap:10px;align-items:center;color:var(--muted)}
.ladder li.open .lh{color:var(--ink)}
.ln-no{display:inline-grid;place-items:center;width:24px;height:24px;border-radius:50%;background:var(--line);font-size:.8em;font-weight:600}
.ladder li.open .ln-no{background:var(--accent);color:#fff}
.ladder .lb{margin-top:10px;display:flex;flex-direction:column;gap:10px}
.runpair{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,2fr);gap:10px;margin-bottom:10px}
.cheat{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:20px}
.cheat-head{display:flex;justify-content:space-between;align-items:center;gap:10px;border-bottom:2px solid var(--accent);padding-bottom:8px;margin-bottom:14px}
.cheat-grid{columns:2 340px;column-gap:24px}
.cheat-grid section{break-inside:avoid;margin-bottom:16px}
.cheat-grid h3{font-size:1em;color:var(--accent);margin-bottom:6px}
.cheat-grid pre{background:var(--code-bg);color:var(--code-ink);font-family:var(--mono);font-size:.78em;padding:10px 12px;border-radius:8px;overflow-x:auto;margin:0}
.cheat-grid ul,.cheat-grid ol{margin:0;padding-left:18px;font-size:.92em;display:flex;flex-direction:column;gap:3px}
.tools{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:14px;margin-top:20px}
.papers{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:14px}
.plain{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px;font-size:.92em}
.plain .counter{display:block}
details summary{cursor:pointer;font-weight:600;margin:6px 0}

.courses{display:flex;flex-direction:column;gap:6px}
.courses a{display:flex;flex-direction:column;gap:1px;padding:8px 12px;border:1px solid var(--line);border-radius:10px;text-decoration:none;color:var(--ink);background:var(--bg)}
.courses a b{font-family:var(--mono);font-size:.85em}
.courses a span{font-size:.8em;color:var(--muted)}

<script>
/* ---------- helpers ---------- */
const esc = s => String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");
const KW = "public|private|protected|static|final|void|int|double|boolean|char|long|class|extends|implements|interface|abstract|new|return|if|else|for|while|do|try|catch|finally|throw|throws|this|super|null|true|false|break|continue|import";
const RE = new RegExp(`(\\/\\/[^\\n]*)|("(?:[^"\\\\\\n]|\\\\.)*")|('(?:[^'\\\\]|\\\\.)')|\\b(${KW})\\b|\\b(\\d+(?:\\.\\d+)?)\\b|\\b([A-Z][A-Za-z0-9_]*)\\b`,"g");
function hl(src){
  let out="", last=0;
  src.replace(RE,(m,c,s,ch,k,n,t,off)=>{
    out+=esc(src.slice(last,off));
    const cls = c?"c":(s||ch)?"s":k?"k":n?"n":"t";
    out+=`<span class="t-${cls}">${esc(m)}</span>`;
    last=off+m.length; return m;
  });
  return out+esc(src.slice(last));
}
function codeBlock(src, active=-1, dimOthers=false){
  const lines = Array.isArray(src)?src:src.replace(/^\n/,"").replace(/\s+$/,"").split("\n");
  return `<div class="code">${lines.map((l,i)=>`<div class="ln ${i===active?"on":""} ${dimOthers&&active>=0&&i!==active?"":""}"><span class="no">${i+1}</span><span>${hl(l)||" "}</span></div>`).join("")}</div>`;
}
const store = {
  get(){ try{ return JSON.parse(localStorage.getItem("int201lab")||"{}"); }catch(e){ return {}; } },
  set(v){ try{ localStorage.setItem("int201lab",JSON.stringify(v)); }catch(e){} }
};
let progress = store.get(); progress.q = progress.q||{}; progress.lab = progress.lab||{};

/* ---------- course content ---------- */
const UNITS = [
{ id:"methods", title:"User-defined methods", clo:"CLO b",
  sub:"Value-returning and void methods, parameters, pass-by-value and overloading.",
  notes:`
<p>A method packages a task under a name so you can call it many times. Its <b>header</b> states what it returns, its name, and its parameters.</p>
${codeBlock(`
// return type  name   parameter list
static double average(int[] marks) {
    int sum = 0;
    for (int m : marks) {
        sum += m;
    }
    return (double) sum / marks.length;   // value-returning
}

static void printLine(int width) {       // void: returns nothing
    for (int i = 0; i < width; i++) System.out.print("-");
    System.out.println();
}`)}
<ul>
<li><b>Java is always pass-by-value.</b> A primitive argument is copied, so the method cannot change the caller's variable.</li>
<li>When the argument is a reference (an array or an object), the <i>reference</i> is copied. Both copies point to the same object, so changes to the object are visible to the caller.</li>
<li><b>Overloading</b>: several methods share a name but differ in the number or types of parameters. The return type alone is not enough.</li>
<li>Every path through a value-returning method must reach a <code>return</code>.</li>
</ul>
<div class="callout"><b>Try it in the Lab:</b> step through the three scenarios and watch which memory box changes. Students usually predict the array case wrongly the first time.</div>`,
  lab:"methods",
  practice:[
   {k:"Predict the output", code:`static void bump(int x) { x = x + 10; }

public static void main(String[] args) {
    int n = 5;
    bump(n);
    System.out.println(n);
}`, o:["5","15","10","Compile error"], a:0, why:"<code>x</code> is a copy of <code>n</code>. Changing the copy leaves <code>n</code> at 5."},
   {k:"Predict the output", code:`static void bump(int[] a) { a[0] = a[0] + 10; }

int[] arr = {5, 6};
bump(arr);
System.out.println(arr[0]);`, o:["5","15","16","Compile error"], a:1, why:"The reference is copied, but both copies point to the same array, so the change to <code>a[0]</code> is visible through <code>arr</code>."},
   {k:"Predict the output", code:`static int area(int s)    { return s * s; }
static double area(double r) { return 3.0 * r * r; }

System.out.println(area(2) + " " + area(2.0));`, o:["4 12.0","12.0 12.0","4 4","Compile error"], a:0, why:"Overloading is resolved by argument type: <code>area(2)</code> picks the <code>int</code> version and <code>area(2.0)</code> the <code>double</code> version."},
   {k:"Spot the error", code:`static int max(int a, int b) {
    if (a > b) {
        return a;
    }
}`, o:["Runs and returns a","Compile error: missing return statement","Returns 0 when b is larger","Runtime exception"], a:1, why:"When <code>a &lt;= b</code> no return is reached. The compiler rejects the method. Add <code>return b;</code> after the if."}
  ]},
{ id:"arrays", title:"Arrays and arrays of objects", clo:"CLO b",
  sub:"Creating, traversing, searching and sorting arrays; arrays that hold object references.",
  notes:`
<p>An array is an object holding a fixed number of elements of one type. The variable holds a <b>reference</b> to the array.</p>
${codeBlock(`
int[] marks = new int[5];            // five zeros
double[] gpas = {3.2, 2.9, 3.8};     // initializer list
System.out.println(gpas.length);     // 3 (a field, no brackets)

Student[] section = new Student[30]; // 30 null references, NO students yet
section[0] = new Student("Mariam", 3.2);
for (int i = 0; i < section.length; i++) {
    if (section[i] != null) {
        System.out.println(section[i].getName());
    }
}`)}
<ul>
<li>Valid indexes run from <code>0</code> to <code>length - 1</code>. Anything else throws <code>ArrayIndexOutOfBoundsException</code>.</li>
<li>New arrays get default values: <code>0</code>, <code>0.0</code>, <code>false</code>, or <code>null</code> for references.</li>
<li>An array of objects starts as an array of <code>null</code>s. Each element needs its own <code>new</code>.</li>
<li><code>int[] b = a;</code> copies the reference, not the elements. Both names see the same array.</li>
</ul>`,
  lab:"arrays",
  practice:[
   {k:"Predict the output", code:`int[] a = new int[3];
System.out.println(a[1]);`, o:["0","null","Garbage value","Compile error"], a:0, why:"Elements of a new <code>int[]</code> are initialised to 0."},
   {k:"Predict the output", code:`int[] a = {1, 2, 3};
System.out.println(a[a.length]);`, o:["3","0","ArrayIndexOutOfBoundsException","Compile error"], a:2, why:"<code>a.length</code> is 3, and the last valid index is 2."},
   {k:"Predict the output", code:`Student[] s = new Student[2];
System.out.println(s[0].getName());`, o:["null","An empty string","NullPointerException","Compile error"], a:2, why:"<code>s[0]</code> is <code>null</code> because no Student was created. Calling a method on <code>null</code> throws <code>NullPointerException</code>."},
   {k:"Predict the output", code:`int[] a = {4, 9, 2};
int[] b = a;
b[0] = 7;
System.out.println(a[0]);`, o:["4","7","9","Compile error"], a:1, why:"<code>b = a</code> copies the reference. There is only one array, so the change through <code>b</code> shows through <code>a</code>."}
  ]},
{ id:"classes", title:"Classes and objects", clo:"CLO a",
  sub:"Instance and static members, constructors, encapsulation, this, and references to objects.",
  notes:`
<p>A class is a blueprint; an object is one instance built from it with <code>new</code>. Fields hold an object's state and methods define its behaviour.</p>
${codeBlock(`
public class Student {
    private static int count = 0;   // one copy shared by the class
    private String name;            // one copy per object
    private double gpa;

    public Student(String name, double gpa) {   // constructor
        this.name = name;           // this.name = field, name = parameter
        setGpa(gpa);
        count++;
    }
    public void setGpa(double gpa) {
        if (gpa >= 0 && gpa <= 4.0) this.gpa = gpa;   // validation
    }
    public double getGpa() { return gpa; }
    public static int getCount() { return count; }
    public String toString() { return name + " (" + gpa + ")"; }
}`)}
<ul>
<li><b>Encapsulation</b>: keep fields <code>private</code> and expose them through methods that can validate input.</li>
<li><b>Instance</b> members belong to each object; <b>static</b> members belong to the class and are shared.</li>
<li>If you write any constructor, Java no longer supplies the default no-argument one.</li>
<li><code>==</code> compares references (same object?). Use an <code>equals</code> method to compare contents.</li>
</ul>`,
  lab:"classes",
  practice:[
   {k:"Predict the output", code:`class Box {
    static int count = 0;
    int id;
    Box() { count++; id = count; }
}

Box p = new Box();
Box q = new Box();
System.out.println(p.id + " " + Box.count);`, o:["1 1","1 2","2 2","0 2"], a:1, why:"<code>id</code> is per object and was set to 1 for <code>p</code>. <code>count</code> is shared and reached 2 after both constructors ran."},
   {k:"Predict the output", code:`class P {
    int x;
    P(int x) { x = x; }
}

System.out.println(new P(9).x);`, o:["9","0","Compile error","null"], a:1, why:"Inside the constructor, <code>x</code> means the parameter on both sides. The field stays at its default of 0. Write <code>this.x = x;</code>."},
   {k:"Predict the output", code:`Student a = new Student("Ali", 3.0);
Student b = new Student("Ali", 3.0);
System.out.println(a == b);`, o:["true","false","Compile error","Depends on toString()"], a:1, why:"Two <code>new</code> calls create two objects. <code>==</code> checks whether the references point to the same object, so it is false."},
   {k:"Spot the error", code:`// in class Main, using the Student class from the notes
Student s = new Student("Sara", 3.1);
s.gpa = 3.5;`, o:["Runs; gpa becomes 3.5","Compile error: gpa has private access","Runtime exception","Creates a new field"], a:1, why:"<code>gpa</code> is private, so code outside Student cannot touch it. Use <code>s.setGpa(3.5);</code>."}
  ]},
{ id:"inheritance", title:"Inheritance and polymorphism", clo:"CLO c",
  sub:"extends, super, overriding, protected access and dynamic method dispatch.",
  notes:`
<p>Inheritance models an <b>is-a</b> relationship. A subclass gets the fields and methods of its superclass and can add or override them.</p>
${codeBlock(`
public class Shape {
    public double area() { return 0.0; }       // general version, overridden below
    public String name() { return "Shape"; }
    public String describe() { return name() + " with area " + area(); }
}
public class Rectangle extends Shape {
    protected double w, h;
    public Rectangle(double w, double h) { this.w = w; this.h = h; }
    @Override public double area() { return w * h; }
    @Override public String name() { return "Rectangle"; }
}
public class Square extends Rectangle {
    public Square(double side) { super(side, side); }  // must be first line
    @Override public String name() { return "Square"; }
}

Shape s = new Square(2);         // declared type Shape, actual type Square
System.out.println(s.describe()); // Square with area 4.0`)}
<ul>
<li><b>Compile time:</b> the declared type decides which methods you are allowed to call.</li>
<li><b>Run time:</b> the actual object decides which version runs (dynamic dispatch). Java starts in the object's class and walks up until it finds an implementation.</li>
<li>Constructors are not inherited. A subclass constructor calls <code>super(...)</code> first, explicitly or implicitly.</li>
<li>Inside an overriding method, <code>super.methodName()</code> runs the superclass version. Mark overriding methods with <code>@Override</code> so the compiler checks the signature.</li>
</ul>`,
  lab:"inheritance",
  practice:[
   {k:"Predict the output", code:`class Animal { String sound() { return "..."; } }
class Dog extends Animal { String sound() { return "Woof"; } }

Animal a = new Dog();
System.out.println(a.sound());`, o:["...","Woof","Compile error","ClassCastException"], a:1, why:"The object is a Dog, so Dog's overriding <code>sound()</code> runs, even through an Animal reference."},
   {k:"Predict the output", code:`class A { A() { System.out.print("A"); } }
class B extends A { B() { System.out.print("B"); } }
class C extends B { C() { System.out.print("C"); } }

new C();`, o:["C","CBA","ABC","AC"], a:2, why:"Each constructor first calls its superclass constructor, so the chain finishes from the top down: A, then B, then C."},
   {k:"Spot the error", code:`class Animal { String sound() { return "..."; } }
class Dog extends Animal { void fetch() { System.out.println("Fetching"); } }

Animal a = new Dog();
a.fetch();`, o:["Prints Fetching","Compile error: cannot find symbol fetch()","ClassCastException","Prints nothing"], a:1, why:"The compiler only knows <code>a</code> as an Animal, and Animal has no <code>fetch()</code>. Cast first: <code>((Dog) a).fetch();</code>."},
   {k:"Spot the error", code:`class Vehicle {
    private int speed;
    Vehicle(int speed) { this.speed = speed; }
}
class Car extends Vehicle {
    Car() { }
}`, o:["Compiles; speed is 0","Compile error: constructor Vehicle in class Vehicle cannot be applied to given types","Runtime exception when a Car is created","Compiles, because constructors are inherited"], a:1, why:"Car's constructor calls <code>super()</code> implicitly, but Vehicle has no no-argument constructor. Write <code>Car() { super(0); }</code>."}
  ]},
{ id:"recursion", title:"Recursion", clo:"CLO e",
  sub:"Base case, recursive case, the call stack and how results come back.",
  notes:`
<p>A recursive method solves a problem by calling itself on a smaller version of the same problem.</p>
${codeBlock(`
static int factorial(int n) {
    if (n <= 1) {              // base case: answer known directly
        return 1;
    }
    return n * factorial(n - 1);   // recursive case: smaller problem
}`)}
<ul>
<li>Every recursive method needs a <b>base case</b> that stops the calls, and each recursive call must move closer to it.</li>
<li>Each call gets its own stack frame with its own copy of the parameters. Frames wait until the call above them returns.</li>
<li>No reachable base case means frames pile up until Java throws <code>StackOverflowError</code>.</li>
<li>Recursion is elegant for naturally self-similar problems (digits, trees, divide-and-conquer). A loop is usually cheaper for simple counting.</li>
</ul>
<div class="callout"><b>Classroom tip:</b> in the Lab, ask students to predict the stack height before pressing Play, then tick "Remove the base case" to show the overflow.</div>`,
  lab:"recursion",
  practice:[
   {k:"Predict the output", code:`static int f(int n) {
    if (n == 0) return 0;
    return n + f(n - 1);
}

System.out.println(f(4));`, o:["4","10","24","StackOverflowError"], a:1, why:"4 + 3 + 2 + 1 + 0 = 10."},
   {k:"Predict the output", code:`static void p(int n) {
    if (n == 0) return;
    p(n - 1);
    System.out.print(n);
}

p(3);`, o:["321","123","3210","0123"], a:1, why:"The print happens after the recursive call returns, so the deepest call (n = 1) prints first."},
   {k:"Spot the error", code:`static int sum(int n) {
    return n + sum(n - 1);
}

System.out.println(sum(5));`, o:["15","0","StackOverflowError at run time","Compile error"], a:2, why:"There is no base case, so calls continue past 0 into negative numbers until the stack runs out."},
   {k:"Predict the output", code:`static int fib(int n) {
    if (n <= 1) return n;
    return fib(n - 1) + fib(n - 2);
}

System.out.println(fib(5));`, o:["3","5","8","15"], a:1, why:"fib: 0, 1, 1, 2, 3, 5. fib(5) is 5."}
  ]},
{ id:"composition", title:"Composition", clo:"CLO d",
  sub:"has-a relationships, container classes, delegation and defensive copies.",
  notes:`
<p>Composition builds a class out of other objects: a <b>has-a</b> relationship. The outer class delegates work to the objects it contains.</p>
${codeBlock(`
public class Course {
    private String code;
    private Instructor instructor;        // has-a Instructor
    private Student[] roster = new Student[40];
    private int size = 0;

    public Course(String code, Instructor instructor) {
        this.code = code;
        this.instructor = instructor;
    }
    public boolean enroll(Student s) {
        if (size == roster.length) return false;
        roster[size++] = s;
        return true;
    }
    public double averageGpa() {          // delegation to Student
        double total = 0;
        for (int i = 0; i < size; i++) total += roster[i].getGpa();
        return size == 0 ? 0 : total / size;
    }
    public String toString() {
        return code + " taught by " + instructor;   // calls Instructor.toString()
    }
}`)}
<ul>
<li>Ask "is-a or has-a?" A Square <i>is a</i> Rectangle (inheritance); a Course <i>has an</i> Instructor (composition).</li>
<li>In strict composition the part lives and dies with the whole (a House and its Rooms). In aggregation the part can exist on its own.</li>
<li>Storing a caller's object directly shares it. If outside code later changes that object, your object changes too. A <b>defensive copy</b> prevents this.</li>
<li>In UML a filled diamond marks composition; a hollow diamond marks aggregation.</li>
</ul>`,
  lab:"composition",
  practice:[
   {k:"Concept", code:"", q:"A Car contains an Engine object as a private field. What relationship is this?", o:["Inheritance (is-a)","Composition (has-a)","Overloading","Polymorphism"], a:1, why:"A Car is not a kind of Engine; it has one. That is composition."},
   {k:"Predict the output", code:`class Date {
    int day;
    Date(int day) { this.day = day; }
    public String toString() { return "D" + day; }
}
class Event {
    private Date when;
    Event(Date d) { when = d; }
    public String toString() { return "Event on " + when; }
}

Date x = new Date(5);
Event e = new Event(x);
x.day = 9;
System.out.println(e);`, o:["Event on D5","Event on D9","Event on null","Compile error"], a:1, why:"Event stored the same Date object that <code>x</code> points to. Changing it through <code>x</code> changes the event's date. Use <code>when = new Date(d.day);</code> to copy it."},
   {k:"Concept", code:"", q:"In a UML class diagram, which symbol marks composition?", o:["Hollow triangle arrow","Filled (black) diamond","Hollow diamond","Dashed arrow"], a:1, why:"Filled diamond: composition. Hollow diamond: aggregation. Hollow triangle: inheritance. Dashed arrow: dependency."},
   {k:"Predict the output", code:`class Engine { public String toString() { return "V6"; } }
class Car {
    private Engine engine = new Engine();
    public String toString() { return "Car with " + engine; }
}

System.out.println(new Car());`, o:["Car with V6","Car with Engine@1b6d3586","Car with null","Compile error"], a:0, why:"String concatenation calls <code>engine.toString()</code>, which Engine overrides to return V6."}
  ]},
{ id:"exceptions", title:"Exception handling", clo:"CLO f",
  sub:"try, catch, finally, checked vs unchecked exceptions, throws and custom exceptions.",
  notes:`
<p>An exception is an object that signals something went wrong. You can <b>handle</b> it with try/catch or <b>declare</b> it with <code>throws</code> and let the caller deal with it.</p>
${codeBlock(`
public class InvalidGpaException extends Exception {   // checked custom exception
    public InvalidGpaException(String msg) { super(msg); }
}

public void setGpa(double gpa) throws InvalidGpaException {
    if (gpa < 0 || gpa > 4.0) {
        throw new InvalidGpaException("GPA out of range: " + gpa);
    }
    this.gpa = gpa;
}

try {
    s.setGpa(4.7);
} catch (InvalidGpaException e) {
    System.out.println(e.getMessage());
} finally {
    System.out.println("done");          // runs in every case
}`)}
<ul>

function memStepper(el, scenarios){
  let si=0, i=0;
  function val(v){ return /^@\d/.test(v)?`<span class="ref">→ ${v}</span>`:esc(v); }
  function render(){
    const sc=scenarios[si], st=sc.steps[i], ch=st.ch||[];
    const frames=st.s.map((f,k)=>`<div class="frame ${k===st.s.length-1?"top":""}"><b>${esc(f[0])}</b>${f[1].length?f[1].map(([n,v])=>`<div class="kv ${ch.includes(n)&&k===st.s.length-1||ch.includes(n)&&f[0]==="main"?"ch":""}"><span>${esc(n)}</span><span>${val(v)}</span></div>`).join(""):'<span class="muted">(no locals yet)</span>'}</div>`).reverse().join("");
    const heap=st.h.length?st.h.map(([id,t,fs,g])=>`<div class="obj ${g?"garbage":""}"><b>${id==="Student"?"Class area: Student":esc(id)+" · "+esc(t)}${g?" (garbage)":""}</b>${fs.map(([n,v])=>`<div class="kv ${ch.includes(id+"."+n)?"ch":""}"><span>${esc(n)}</span><span>${val(v)}</span></div>`).join("")}</div>`).join(""):'<span class="muted">Empty</span>';
    el.innerHTML=`
      <div class="controls" style="margin-bottom:12px">${scenarios.map((s,k)=>`<button type="button" class="chip ${k===si?"on":""}" data-s="${k}">${esc(s.name)}</button>`).join("")}</div>
      <div class="lab-wrap">
        <div class="stack">${codeBlock(sc.code, st.l)}
          <div class="controls">
            <button type="button" class="btn" data-a="back" ${i===0?"disabled":""}>◀ Back</button>
            <button type="button" class="btn primary" data-a="next" ${i===sc.steps.length-1?"disabled":""}>Next step ▶</button>
            <button type="button" class="btn" data-a="reset">Restart</button>
            <span class="counter">Step ${i+1} / ${sc.steps.length}</span>
          </div>
          <div class="caption">${esc(st.c)}</div>
        </div>
        <div class="stack">
          ${sc.noHeap?`<div><h4 class="sm">Variables in memory${st.s.length>1?" (top frame first)":""}</h4>${frames}</div>`:`<div class="mem"><div><h4>Stack (top frame first)</h4>${frames}</div><div><h4>Heap</h4>${heap}</div></div>`}
          <div class="console">${esc(st.o)}</div>
          <div class="legend"><span style="--c:var(--accent)">running frame</span><span style="--c:var(--run)">changed in this step</span></div>
        </div>
      </div>`;
  }
  el.addEventListener("click",e=>{
    const b=e.target.closest("button"); if(!b) return;
    if(b.dataset.s!==undefined){ si=+b.dataset.s; i=0; }
    else if(b.dataset.a==="next") i++;
    else if(b.dataset.a==="back") i--;
    else if(b.dataset.a==="reset") i=0;
    render();
  });
  render();
}

    for(let i=0;i<a.length;i++){ sum+=a[i]; S.push({l:2,a:[...a],i,v:{i,sum:sum.toFixed(1)},c:`Add a[${i}] = ${a[i]}. sum = ${sum.toFixed(1)}.`}); }

    S.push({l:4,a:[...a],v:{sum:sum.toFixed(1),average:avg.toFixed(2)},c:"Printed.",o:`Sum: ${sum.toFixed(1)}, Average: ${avg.toFixed(2)}`}); return S; }},
 max:{name:"Find maximum", code:[

"        max = a[i];",

"}",

    S.push({l:0,a:[...a],best:0,v:{max},c:`Start by assuming the first element, ${max}, is the largest.`});
    for(let i=1;i<a.length;i++){
      S.push({l:2,a:[...a],i,best:bi,v:{i,max},c:`Compare a[${i}] = ${a[i]} with max = ${max}.`});
      if(a[i]>max){ max=a[i]; bi=i; S.push({l:3,a:[...a],i,best:bi,v:{i,max},c:`${a[i]} is larger, so max becomes ${max}.`}); }
    }
    S.push({l:6,a:[...a],best:bi,v:{max},c:`Loop finished after ${a.length-1} comparisons.`,o:`Max = ${max}`}); return S; }},
 search:{name:"Linear search", target:true, code:[
"int index = -1;",
"for (int i = 0; i < a.length; i++) {",
"    if (a[i] == target) {",
"        index = i;",
"        break;",
"    }",
"}",
"System.out.println(\"Index = \" + index);"],
  run(a,t){ const S=[]; let idx=-1;
    S.push({l:0,a:[...a],v:{target:t,index:-1},c:`-1 means "not found yet".`});
    for(let i=0;i<a.length;i++){
      S.push({l:2,a:[...a],i,v:{i,target:t,index:idx},c:`Is a[${i}] (${a[i]}) equal to ${t}?`});
      if(a[i]===t){ idx=i; S.push({l:4,a:[...a],best:i,v:{i,target:t,index:idx},c:`Found it at index ${i}. break leaves the loop early.`}); break; }
    }
    if(idx<0) S.push({l:7,a:[...a],v:{target:t,index:-1},c:`Checked all ${a.length} elements without a match.`,o:"Index = -1"});
    else S.push({l:7,a:[...a],best:idx,v:{target:t,index:idx},c:"Print the result.",o:`Index = ${idx}`});
    return S; }},
 bubble:{name:"Bubble sort", code:[
"for (int i = 0; i < a.length - 1; i++) {",
"    for (int j = 0; j < a.length - 1 - i; j++) {",
"        if (a[j] > a[j + 1]) {",
"            int t = a[j]; a[j] = a[j + 1]; a[j + 1] = t;",
"        }",
"    }",
"}"],
  run(a){ const S=[]; a=[...a]; const n=a.length; let swaps=0, comps=0;
    for(let i=0;i<n-1;i++){

        comps++;

        if(a[j]>a[j+1]){ [a[j],a[j+1]]=[a[j+1],a[j]]; swaps++; S.push({l:3,a:[...a],i:j,j:j+1,sorted:n-i,v:{i,j,comparisons:comps,swaps},c:`Out of order, so swap them.`}); }
      }
      S.push({l:0,a:[...a],sorted:n-i-1,v:{i,comparisons:comps,swaps},c:`End of pass ${i+1}: the largest remaining value has bubbled to index ${n-1-i}.`});
    }
    S.push({l:6,a:[...a],sorted:0,v:{comparisons:comps,swaps},c:`Sorted with ${comps} comparisons and ${swaps} swaps.`,o:"["+a.join(", ")+"]"}); return S; }},
 reverse:{name:"Reverse in place", code:[
"for (int i = 0; i < a.length / 2; i++) {",
"    int t = a[i];",
"    a[i] = a[a.length - 1 - i];",
"    a[a.length - 1 - i] = t;",
"}"],
  run(a){ const S=[]; a=[...a]; const n=a.length;
    for(let i=0;i<Math.floor(n/2);i++){
      S.push({l:0,a:[...a],i,j:n-1-i,v:{i,"a.length-1-i":n-1-i},c:`Pair index ${i} with index ${n-1-i}.`});
      [a[i],a[n-1-i]]=[a[n-1-i],a[i]];
      S.push({l:3,a:[...a],i,j:n-1-i,v:{i,"a.length-1-i":n-1-i},c:`Swap using the temporary variable t.`});
    }
    S.push({l:4,a:[...a],v:{},c:`Done after ${Math.floor(n/2)} swaps. The middle element of an odd-length array never moves.`,o:"["+a.join(", ")+"]"}); return S; }}

const RFN = {
 factorial:{name:"factorial(n)", params:[["n",4,1,10]], code:[

"static int power(int b, int e) {",

"    }",

"}"],

"static int sumDigits(int n) {",

"        return n;              // base case",
"    }",
"    return n % 10 + sumDigits(n / 10);",
"}"],
  label:a=>`sumDigits(${a[0]})`, base:a=>a[0]<10, bval:a=>a[0], kids:a=>[[Math.floor(a[0]/10)]],
  expr:(a,v)=>`${a[0]%10} + ${v[0]??`sumDigits(${Math.floor(a[0]/10)})`}`, comb:(a,v)=>a[0]%10+v[0]},
 fib:{name:"fib(n)", params:[["n",4,0,6]], code:[
"static int fib(int n) {",
"    if (n <= 1) {",
"        return n;              // base case",
"    }",
"    return fib(n - 1) + fib(n - 2);",
"}"],
  label:a=>`fib(${a[0]})`, base:a=>a[0]<=1, bval:a=>a[0], kids:a=>[[a[0]-1],[a[0]-2]],
  expr:(a,v)=>`${v[0]??`fib(${a[0]-1})`} + ${v[1]??`fib(${a[0]-2})`}`, comb:(a,v)=>v[0]+v[1]}
};
function traceRec(F, args, noBase){
  const S=[], stack=[]; let calls=0, maxDepth=0, overflow=false;
  const snap=(l,c,extra={})=>S.push({l,c,stack:stack.map(f=>({...f})),calls,maxDepth,...extra});
  function go(a){
    if(overflow) return 0;
    calls++; stack.push({label:F.label(a),note:"checking base case",st:""}); maxDepth=Math.max(maxDepth,stack.length);
    snap(0,`Call ${F.label(a)}: a new frame is pushed with its own copy of the parameters.`);
    if(noBase && stack.length>=11){ overflow=true; stack[stack.length-1].st="err"; stack[stack.length-1].note="…thousands more frames";
      snap(0,"Without a base case nothing stops the calls. Each frame uses memory until the stack is full.",{err:true}); return 0; }
    const top=stack[stack.length-1];
    if(!noBase && F.base(a)){
      const v=F.bval(a); top.note=`base case → returns ${v}`; top.st="ret";
      snap(2,`${F.label(a)} reaches the base case and returns ${v} directly.`);
      stack.pop(); snap(2,`The frame for ${F.label(a)} is popped. Its caller resumes with the value ${v}.`); return v;
    }
    snap(1,noBase?`The base-case check has been removed, so ${F.label(a)} recurses again.`:`${F.label(a)} is not a base case.`);
    const vals=[]; top.note=`waiting: ${F.expr(a,vals)}`;
    snap(4,`${F.label(a)} must wait for a smaller call before it can finish.`);
    for(const k of F.kids(a)){
      const v=go(k); if(overflow) return 0;
      vals.push(v); top.note=`waiting: ${F.expr(a,vals)}`;
    }
    const r=F.comb(a,vals); top.note=`${F.expr(a,vals)} = ${r}`; top.st="ret";
    snap(4,`All results are back, so ${F.label(a)} computes ${F.expr(a,vals)} = ${r}.`);
    stack.pop(); snap(4,`Return ${r} and pop the frame.`); return r;
  }
  const res=go(args);
  if(overflow) S.push({l:0,c:"Exception in thread \"main\" java.lang.StackOverflowError",stack:[],calls,maxDepth,err:true,o:"Exception in thread \"main\" java.lang.StackOverflowError"});
  else S.push({l:-1,c:`Final answer: ${F.label(args)} = ${res}. ${calls} calls in total, maximum stack depth ${maxDepth}.`,stack:[],calls,maxDepth,o:String(res)});
  return S;
}

const CLS = {
 Object:{parent:null, own:{}, note:"root of every class"},
 Shape:{parent:"Object", own:{"area()":"0.0","name()":"\"Shape\"","describe()":"name() + \" with area \" + area()"}, ctor:"new Shape()"},
 Circle:{parent:"Shape", own:{"area()":"Math.PI * r * r","name()":"\"Circle\"","getRadius()":"r"}, ctor:"new Circle(2)"},
 Rectangle:{parent:"Shape", own:{"area()":"w * h","name()":"\"Rectangle\""}, ctor:"new Rectangle(2, 3)"},
 Square:{parent:"Rectangle", own:{"name()":"\"Square\""}, ctor:"new Square(2)"}
};
const METHODS=["area()","name()","describe()","getRadius()"];
const ancestors=c=>{ const r=[]; while(c){ r.push(c); c=CLS[c].parent; } return r; };
const isSub=(c,p)=>ancestors(c).includes(p);
function impl(cls,m){ for(const c of ancestors(cls)){ const b=CLS[c].own[m]; if(b) return c; } return null; }
function evalM(obj,m){
  const area={Shape:0,Circle:Math.PI*4,Rectangle:6,Square:4}[obj];
  const nm={Shape:"Shape",Circle:"Circle",Rectangle:"Rectangle",Square:"Square"}[obj];
  const fmt=x=>Number.isInteger(x)?x.toFixed(1):String(x);
  if(m==="area()") return fmt(area);
  if(m==="name()") return nm;
  if(m==="describe()") return `${nm} with area ${fmt(area)}`;
  if(m==="getRadius()") return "2.0";
}
function inheritanceLab(el){
  let decl="Shape", actual="Square", m="describe()";
  function box(c){
    const cl=CLS[c], d=c===decl, a=c===actual;
    const runs = verdict().ok && verdict().impl===c;
    return `<div class="cls ${d?"decl":""} ${a?"actual":""}">${d?'<span class="tag d">declared type</span>':""}${a&&!d?'<span class="tag a">actual object</span>':""}${a&&d?'<span class="tag a">declared + actual</span>':""}
      <b>${c}</b>${cl.note?`<i>${cl.note}</i>`:""}
      <ul>${Object.entries(cl.own).map(([k,v])=>`<li class="${k===m&&runs?"m":""}">${k}${k===m&&runs?" ◀ runs":""}</li>`).join("")||"<li class='muted'>toString(), equals() …</li>"}</ul></div>`;
  }
  function verdict(){
    if(!isSub(actual,decl)) return {ok:false, stage:"Compile time", msg:`<b>error:</b> incompatible types: ${actual} cannot be converted to ${decl}.`, fix:`A ${actual} is not a ${decl}. A variable can only refer to objects of its own type or its subclasses.`};
    const visible = ancestors(decl).some(c=>CLS[c].own[m]);
    if(!visible) return {ok:false, stage:"Compile time", msg:`<b>error:</b> cannot find symbol ${m} in ${decl}.`, fix: isSub(actual,"Circle")&&m==="getRadius()"?`The object really is a Circle, but the compiler only checks the declared type. Use a cast: ((Circle) s).getRadius()`:`${decl} does not declare ${m}.`};
    const c=impl(actual,m);
    return {ok:true, impl:c, out:evalM(actual,m)};
  }
  function render(){
    const v=verdict(); const ctor=CLS[actual].ctor||"new Shape()";
    el.innerHTML=`
      <div class="controls" style="margin-bottom:14px;align-items:flex-end">
        <label class="f" for="decl">Declared type<select id="decl">${["Object","Shape","Rectangle","Circle","Square"].map(c=>`<option ${c===decl?"selected":""}>${c}</option>`).join("")}</select></label>
        <label class="f" for="act">Object created<select id="act">${["Circle","Rectangle","Square","Shape"].map(c=>`<option value="${c}" ${c===actual?"selected":""}>${CLS[c].ctor||"new Shape()"}</option>`).join("")}</select></label>
        <label class="f" for="meth">Method called<select id="meth">${METHODS.map(x=>`<option ${x===m?"selected":""}>${x}</option>`).join("")}</select></label>
      </div>
      <div class="lab-wrap">
        <div class="stack">
          ${codeBlock([`${decl} s = ${ctor};`,`System.out.println(s.${m});`])}
          <div class="verdict ${v.ok?"ok":"err"}">
            ${v.ok?`<span class="stage">Compile time ✓</span><span>${decl} (or a superclass) declares <code>${m}</code>, so the call is allowed.</span>
              <span class="stage">Run time</span><span>The object is a <b>${actual}</b>. Java looks for <code>${m}</code> in ${actual}${v.impl!==actual?`, finds no override, and walks up to <b>${v.impl}</b>`:" and finds it there"}.${m==="describe()"?` Inside describe(), the calls to name() and area() are also dispatched on the ${actual} object.`:""}</span>
              <span class="stage">Output</span><div class="console">${esc(v.out)}</div>`
             :`<span class="stage">${v.stage} ✗</span><span>${v.msg}</span><span class="muted">${esc(v.fix)}</span>`}
          </div>
          <div class="callout">Rule of thumb: <b>the declared type decides what you may call; the object decides what actually runs.</b></div>
        </div>
        <div class="card"><div class="tree">
          <div class="row">${box("Object")}</div><div class="arrow">▲ extends</div>
          <div class="row">${box("Shape")}</div><div class="arrow">▲ extends</div>
          <div class="row" style="align-items:flex-start">${box("Circle")}<div class="tree" style="gap:14px">${box("Rectangle")}<div class="arrow">▲ extends</div>${box("Square")}</div></div>
        </div>
        <div class="legend" style="margin-top:12px"><span style="--c:var(--accent)">declared type (compiler checks here)</span><span style="--c:var(--run)">actual object</span></div></div>
      </div>`;
  }
  el.addEventListener("change",e=>{ if(e.target.id==="decl") decl=e.target.value; if(e.target.id==="act") actual=e.target.value; if(e.target.id==="meth") m=e.target.value; render(); });
  render();
}

/* ---------- exception flow lab ---------- */
const EXC_CODE=[
"static int safeDivide(String text) {",
"    try {",
"        int n = Integer.parseInt(text);",
"        int r = 100 / n;",
"        System.out.println(\"Result: \" + r);",
"        return r;",
"    } catch (NumberFormatException e) {",
"        System.out.println(\"Not a number: \" + e.getMessage());",
"        return -1;",
"    } catch (ArithmeticException e) {",
"        System.out.println(\"Math error: \" + e.getMessage());",
"        return -2;",
"    } finally {",
"        System.out.println(\"finally always runs\");",
"    }",
"}"];
function excTrace(text){
  const S=[], out=[]; const q=text===null?"null":`"${text}"`;
  const push=(l,c)=>S.push({l,c,o:out.join("\n")});
  push(1,`Enter the try block with text = ${q}.`);
  const valid = text!==null && /^[+-]?\d+$/.test(text) && Math.abs(Number(text))<=2147483647;
  if(!valid){
    const msg = text===null?"Cannot parse null string: null":`For input string: "${text}"`;
    push(2,`Integer.parseInt(${q}) cannot turn this into an int and throws NumberFormatException. The rest of the try block is skipped.`);
    push(6,"Java checks the catch blocks from the top. The first one matches NumberFormatException.");
    out.push("Not a number: "+msg); push(7,`e.getMessage() returns: ${msg}`);
    push(8,"return -1 is remembered, but finally must run before the method actually returns.");
    out.push("finally always runs"); push(13,"The finally block runs.");
    push(15,"The method now returns -1 to its caller."); S.ret=-1; return S;
  }
  const n=parseInt(text,10);
  push(2,`parseInt succeeds: n = ${n}.`);
  if(n===0){
    push(3,"100 / 0 with ints throws ArithmeticException. The rest of the try block is skipped.");
    push(6,"The first catch is for NumberFormatException, which does not match, so Java moves on.");
    push(9,"The second catch matches ArithmeticException.");
    out.push("Math error: / by zero"); push(10,"e.getMessage() returns \"/ by zero\".");
    push(11,"return -2 is remembered while finally runs.");
    out.push("finally always runs"); push(13,"The finally block runs.");
    push(15,"The method returns -2."); S.ret=-2; return S;
  }
  const r=Math.trunc(100/n);
  push(3,`r = 100 / ${n} = ${r}${100%n!==0?" (integer division drops the fraction)":""}.`);
  out.push("Result: "+r); push(4,"No exception so far, so the print runs.");
  push(5,`return ${r} is remembered while finally runs. Both catch blocks are skipped.`);
  out.push("finally always runs"); push(13,"The finally block runs even on a normal return.");
  push(15,`The method returns ${r}.`); S.ret=r; return S;
}
function exceptionsLab(el){

        </div>

classes:{
 cards:[
  ["Class vs object","A <b>class</b> is the blueprint: fields and methods. An <b>object</b> is one instance built from it with <code>new</code>, with its own field values."],
  ["What makes a constructor different from a method?","Same name as the class, no return type (not even void), and it runs automatically when <code>new</code> creates the object."],
  ["When does Java give you a default constructor?","Only when you write no constructor at all. Once you write any constructor, <code>new ClassName()</code> needs one you wrote yourself."],
  ["Two uses of <code>this</code>","1. <code>this.name = name;</code> tells the field apart from a parameter with the same name. 2. <code>this(...)</code> calls another constructor of the same class."],
  ["static vs instance variable","An instance variable has one copy per object. A static variable has one copy for the whole class, shared by all objects (for example an object counter)."],
  ["Accessor vs mutator","An <b>accessor</b> (get method) returns a field's value. A <b>mutator</b> (set method) changes it and can validate the new value."],
  ["Why make fields private?","Encapsulation: other classes must go through methods, which can check values (for example a salary must be positive)."],
  ["When is <code>toString()</code> called automatically?","When an object is printed with <code>System.out.println(obj)</code> or joined to a String with +."],
  ["Field vs local variable: default values?","Fields get defaults (0, 0.0, false, null). Local variables get none, and using one before assigning it is a compile error."],
  ["<code>==</code> vs <code>equals</code> for objects","<code>==</code> asks: same object? <code>equals</code> (when the class defines it) asks: same contents?"]

  ["What does <code>extends</code> give a subclass?","All public and protected members of the superclass. Java allows only one superclass per class."],

  ["Rules for <code>super(...)</code>","It calls a superclass constructor and must be the first statement. If you leave it out, Java inserts <code>super()</code>, which fails when the superclass has no no-argument constructor."],
  ["Overriding vs overloading","<b>Overriding</b>: a subclass redefines a method with the same signature. <b>Overloading</b>: same name, different parameters, usually in the same class."],
  ["What does <code>@Override</code> do?","It asks the compiler to check that the method really overrides one in the superclass, which catches spelling and parameter mistakes."],
  ["Polymorphism in one sentence","A superclass reference can point to any subclass object, and the object's own version of an overridden method runs (dynamic binding)."],
  ["In what order do constructors run in a hierarchy?","From the top down: the superclass constructor finishes first, then the subclass constructor. <code>new C()</code> with C extends B extends A runs A, then B, then C."],
  ["How does an overriding method reuse the superclass version?","It calls <code>super.methodName(...)</code>, for example <code>super.print();</code> at the start of Surgeon's print()."],
  ["<code>protected</code> access","Visible in the same package and in subclasses."],
  ["Upcasting, downcasting and <code>instanceof</code>","<code>Shape s = new Circle(1);</code> upcasts automatically. <code>(Circle) s</code> downcasts and throws ClassCastException if s is not really a Circle, so check with <code>s instanceof Circle</code> first."]

 cards:[
  ["Base case","The case answered directly, without another recursive call. It stops the recursion."],
  ["Recursive case","The case where the method calls itself on a smaller problem, one that moves toward the base case."],
  ["What causes StackOverflowError?","Recursion that never reaches a base case. Each call adds a stack frame until memory runs out."],
  ["What is stored in each stack frame?","The call's own parameters and local variables, plus the point to return to. Each call has separate copies."],
  ["How do you trace a recursive call?","Write the calls going down until the base case, then fill in the return values coming back up."],
  ["Direct vs indirect recursion","Direct: method A calls A. Indirect: A calls B, and B calls A."],
  ["Recursion or a loop?","Use recursion when the problem is naturally self-similar (digits, divide and conquer, trees). A loop is cheaper for simple repetition."],
  ["Recursive multiply m × n by repeated addition (Lab 9, Ex 3)","<code>if (n == 0) return 0;<br>return m + multiply(m, n - 1);</code>"]

  {t:"power with negative exponents (Lab 9, Ex 2)", cls:"TracePower", code:`public class TracePower {
    static double power(int x, int y) {
        if (y == 0) return 1;
        if (y == 1) return x;
        if (y < 0) return 1.0 / power(x, -y);
        return x * power(x, y - 1);
    }
    public static void main(String[] args) {

        if (n == 0) {
            System.out.println();
            return;
        }
        System.out.print("* ");
        printLine(n - 1);
    }
    static void pattern(int n) {
        if (n == 0) return;

 cards:[
  ["Composition","A class has another object as a field: a has-a relationship. Example: a Person has a Job (Lab 11)."],
  ["How do you choose between inheritance and composition?","Ask \"is-a or has-a?\" A Surgeon is a Doctor: inheritance. A Cinema has a feature movie: composition."],
  ["Composition vs aggregation","In composition the part belongs to the whole and is usually created by it. In aggregation the part can exist on its own and may be shared."],
  ["What is delegation?","The outer class does part of its job by calling methods of the object it contains, such as <code>featureMovie.print()</code> inside <code>Cinema.print()</code>."],
  ["How does <code>\"Job: \" + job</code> work?","String concatenation calls <code>job.toString()</code> automatically. Without an overriding toString you get something like <code>Job@1b6d3586</code>."],
  ["What is a defensive copy?","Storing a new copy of an object passed in, so later changes the caller makes to the original do not reach your object."],
  ["Common composition bug","Declaring the field <code>private Engine engine;</code> but never creating it. Any call such as <code>engine.getHp()</code> then throws NullPointerException."],
  ["UML: composition vs aggregation symbols","Filled (black) diamond: composition. Hollow diamond: aggregation. The diamond sits next to the whole."]

 cards:[
  ["What is an exception?","An object that represents an error or unusual event at run time. If nothing catches it, the program stops with a stack trace."],
  ["Roles of try, catch and finally","<b>try</b>: code that might fail. <b>catch</b>: handles one type of exception. <b>finally</b>: runs whatever happens, often for clean-up."],
  ["Checked vs unchecked","<b>Checked</b> (such as IOException) must be caught or declared with throws. <b>Unchecked</b> (RuntimeException and its subclasses) need not be."],
  ["<code>throw</code> vs <code>throws</code>","<code>throw new X(...)</code> raises an exception now. <code>throws X</code> in a method header warns callers that the method may pass X on to them."],
  ["Rule for ordering catch blocks","Put specific types before general ones. A catch for Exception placed first makes later catches unreachable, which is a compile error."],
  ["When does InputMismatchException happen?","When <code>nextInt()</code> reads a token that is not an int, such as \"n\". The bad token stays in the Scanner, so call <code>console.nextLine()</code> before reading again."],

  notes:`
<p>A Java program is a collection of classes, and every application has a <code>main</code> method where execution starts. A <b>variable</b> has a name, a data type, a size and a value, and must be declared before it is used.</p>
${codeBlock(`
public class Grades {
    public static void main(String[] args) {
        final int NO_OF_COURSES = 2;      // named constant: cannot change
        int javaGrade = 90;               // integral type
        int aiGrade = 80;
        double avg;                       // floating-point type

        avg = (javaGrade + aiGrade) / 2.0;
        System.out.println("Average is " + avg);   // Average is 85.0
    }
}`)}
<ul>
<li><b>Identifiers</b> use letters, digits, <code>_</code> and <code>$</code>, must not start with a digit, and cannot be reserved words such as <code>int</code> or <code>class</code>.</li>
<li><b>Primitive types:</b> integral (<code>char byte short int long</code>), floating-point (<code>float double</code>) and <code>boolean</code>.</li>
<li><code>* / %</code> are done before <code>+ -</code>; equal precedence is evaluated left to right.</li>
<li>With two int operands, <code>/</code> drops the fraction (<code>7 / 2</code> is 3) and <code>%</code> gives the remainder (<code>7 % 2</code> is 1). If either operand is a double, the result is a double.</li>
<li><b>Casting:</b> <code>(int)(7.9 + 6.7)</code> is 14, but <code>(int)7.9 + (int)6.7</code> is 13.</li>
<li><b>String +</b> works left to right: <code>"Sum = " + 12 + 26</code> gives <code>Sum = 1226</code>, while <code>"Sum = " + (12 + 26)</code> gives <code>Sum = 38</code>.</li>
<li><code>x++</code> uses x and then adds 1; <code>++x</code> adds 1 first and then uses the new value.</li>
</ul>`,

if (status.equals("married")) { ... }   // compare Strings with equals`)}
<ul>
<li>Each <code>else</code> pairs with the most recent unmatched <code>if</code>.</li>
<li>The switch selector can be <code>int</code>, <code>char</code>, <code>short</code>, <code>byte</code> or <code>String</code>; each case value appears once.</li>
<li>Without <code>break</code>, execution <b>falls through</b> into the next case.</li>
<li>Compare Strings with <code>equals</code> (or <code>compareTo</code> for order), never with <code>==</code>.</li>
<li><b>Short-circuit:</b> <code>&amp;&amp;</code> stops when the left side is false, and <code>||</code> stops when it is true. So <code>y != 0 &amp;&amp; x / y &gt; 2</code> never divides by zero.</li>
</ul>`,
